<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Data Export - Smart Link</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff0050;    /* Đỏ TikTok */
      --secondary: #00f2ea;  /* Xanh Cyan */
      --bg-color: #f0f4f8;   /* Nền xám nhạt */
      --card-bg: #ffffff;
      --border-color: #000000;
      --text-color: #000000;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- HOME BUTTON --- */
    .top-nav {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 15px;
    }

    .home-btn {
      text-decoration: none;
      background: #fff;
      color: var(--text-color);
      font-weight: 700;
      padding: 10px 20px;
      border: 3px solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      border-radius: 50px; /* Bo tròn kiểu viên thuốc */
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .home-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-color);
      background: var(--secondary);
    }

    .home-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    /* --- MAIN CARD --- */
    main {
      width: 100%;
      max-width: 1000px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      box-shadow: 8px 8px 0px var(--border-color);
      border-radius: 15px;
      padding: 30px;
      margin-bottom: 40px;
    }

    /* --- HEADER --- */
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 36px;
      text-align: center;
      color: var(--primary);
      text-shadow: 2px 2px 0px #000; /* Hiệu ứng chữ nổi */
      margin-top: 0;
      margin-bottom: 30px;
      border-bottom: 3px dashed var(--border-color);
      padding-bottom: 20px;
      letter-spacing: 1px;
    }

    /* --- CONTROLS FORM --- */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr auto auto;
      gap: 15px;
      margin-bottom: 30px;
      align-items: end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hint {
      font-size: 11px;
      color: #666;
      font-weight: 500;
      text-transform: none;
      margin-left: 5px;
    }

    /* Style Input Neubrutalism */
    input {
      padding: 12px 15px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 3px 3px 0px var(--border-color);
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      background-color: #fffde7; /* Vàng nhạt khi focus */
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--border-color);
    }

    /* Style Button Neubrutalism */
    button {
      padding: 12px 24px;
      font-family: 'Be Vietnam Pro', sans-serif;
      font-size: 16px;
      font-weight: 700;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: all 0.15s ease;
      height: 48px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    #fetchBtn {
      background-color: var(--primary);
      color: #fff;
    }

    #fetchBtn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-color);
      background-color: #ff3370;
    }

    #downloadCsvBtn {
      background-color: var(--secondary);
      color: #000;
    }

    #downloadCsvBtn:hover:not(:disabled) {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-color);
      background-color: #33fff9;
    }

    button:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    button:disabled {
      background-color: #e0e0e0;
      color: #888;
      border-color: #888;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* --- STATS BOARD --- */
    #stats-board {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #fff;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 4px 4px 0px var(--border-color);
      transition: transform 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-avg {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      background: var(--secondary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 4px 10px;
      display: inline-block;
      box-shadow: 1px 1px 0px var(--border-color);
    }

    /* --- LOGGER --- */
    #status {
      margin-bottom: 20px;
      padding: 15px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      box-shadow: 4px 4px 0px #ccc;
      min-height: 54px;
      display: flex;
      align-items: center;
    }
    
    .log-loading { color: #007bff; }
    .log-success { color: #009944; }
    .log-error { color: #ff0050; }

    /* --- TABLE --- */
    .table-container {
      overflow-x: auto;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 4px 4px 0px var(--border-color);
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background-color: var(--secondary);
      color: #000;
      font-weight: 800;
      text-transform: uppercase;
      padding: 15px;
      border-bottom: 2px solid var(--border-color);
      text-align: left;
      white-space: nowrap;
    }

    td {
      padding: 12px 15px;
      border-bottom: 1px solid #000;
      color: #000;
      font-weight: 500;
      vertical-align: middle;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    
    tr:hover {
      background-color: #fffde7; /* Vàng nhạt khi hover row */
    }

    /* Table internal elements */
    .col-thumb img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
    }

    .col-status {
      background: #d4edda;
      color: #155724;
      border: 2px solid #155724;
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      box-shadow: 2px 2px 0px rgba(21, 87, 36, 0.3);
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      border-bottom: 2px solid transparent;
    }
    a:hover {
      border-bottom: 2px solid var(--primary);
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      .controls {
        grid-template-columns: 1fr;
      }
      button {
        width: 100%;
      }
      #stats-board {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="https://thanhnhut201294.github.io/tool/" class="home-btn">
      <span>↩</span> Quay lại trang chủ
    </a>
  </nav>

  <main>
    <h1>TikTok Data Export - Smart Link</h1>
    
    <div class="controls">
      <div class="input-group">
        <label>Link Kênh / ID TikTok</label>
        <input id="username" placeholder="Ví dụ: letuankhang2002" value="https://www.tiktok.com/@letuankhang2002" />
      </div>
      <div class="input-group">
        <label>Số lượng <span class="hint">(Max 48)</span></label>
        <input id="limit" type="number" value="10" min="1" max="48" />
      </div>
      <button id="fetchBtn">🚀 Quét Data</button>
      <button id="downloadCsvBtn" disabled>💾 Tải Excel</button>
    </div>

    <div id="stats-board"></div>

    <div id="status">👋 Sẵn sàng. Dán link kênh vào ô trên để bắt đầu!</div>
    <div id="output" class="table-container"></div>
  </main>

  <script>
    // === CẤU HÌNH PROXY XOAY VÒNG ===
    const PROXY_LIST = [
        { url: 'https://api.codetabs.com/v1/proxy?quest=', type: 'direct' },
        { url: 'https://api.allorigins.win/get?url=', type: 'wrapped' },
        { url: 'https://corsproxy.io/?', type: 'direct' }
    ];

    let currentData = []; 

    function log(msg, type = 'default') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `log-${type}`;
    }

    // === HÀM TÁCH USERNAME TỪ LINK ===
    function extractUsername(input) {
        if (!input) return '';
        let clean = input.trim();
        
        // Trường hợp 1: Link đầy đủ chứa @
        const atIndex = clean.indexOf('@');
        if (atIndex !== -1) {
            let afterAt = clean.substring(atIndex + 1);
            return afterAt.split('?')[0].split('/')[0];
        }
        
        // Trường hợp 2: Link tiktok.com/user
        if (clean.includes('tiktok.com/')) {
             clean = clean.replace(/\/$/, '');
             return clean.split('/').pop();
        }

        // Trường hợp 3: ID thuần
        return clean;
    }

    // Smart Fetch
    async function smartFetch(targetUrl) {
        for (const proxy of PROXY_LIST) {
            try {
                const finalUrl = proxy.url + encodeURIComponent(targetUrl);
                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error('Network Error');
                
                let data;
                if (proxy.type === 'wrapped') {
                    const temp = await res.json();
                    if(!temp.contents) throw new Error("No contents");
                    data = JSON.parse(temp.contents);
                } else {
                    data = await res.json();
                }

                if (data.code === -1) throw new Error("Limit Reached");
                return data; 
            } catch (e) {
                // Fail silently, try next proxy
            }
        }
        throw new Error("Không thể kết nối Server. Vui lòng thử lại sau vài phút.");
    }

    // Logic lấy video
    async function fetchTikTokVideos(rawInput, maxVideos) {
      const username = extractUsername(rawInput);
      if (!username) throw new Error("Không tìm thấy Username hợp lệ!");

      log(`Đang quét dữ liệu cho ID: ${username}...`, 'loading');

      if (maxVideos > 48) {
          maxVideos = 48;
          document.getElementById('limit').value = 48;
      }

      const allVideos = [];
      const processedIds = new Set();
      let cursor = 0;
      let hasMore = true;

      while (hasMore) {
        log(`⏳ Đang tải... Đã lấy: ${allVideos.length}/${maxVideos} video (ID: ${username})`, 'loading');

        const targetUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=30&cursor=${cursor}`;
        const data = await smartFetch(targetUrl);
        
        if (!data?.data?.videos) {
            if(allVideos.length === 0) throw new Error(`Không tìm thấy dữ liệu cho ID: ${username} (Kênh Riêng tư hoặc Sai Link)`);
            break;
        }

        for (const v of data.data.videos) {
          if (!v.video_id || processedIds.has(v.video_id)) continue;
          if (allVideos.length >= maxVideos) { hasMore = false; break; }
          allVideos.push(v);
          processedIds.add(v.video_id);
        }

        cursor = data.data.cursor;
        if (!data.data.hasMore || allVideos.length >= maxVideos) {
             hasMore = false;
        } else {
             await new Promise(r => setTimeout(r, 1500)); 
        }
      }
      return { videos: allVideos, realUsername: username };
    }

    // Render Stats
    function renderStats(videos) {
        const board = document.getElementById('stats-board');
        if (videos.length === 0) {
            board.style.display = 'none';
            return;
        }

        let totalView = 0, totalLike = 0, totalCmt = 0, totalSave = 0, totalShare = 0;

        videos.forEach(v => {
            totalView += (v.play_count || 0);
            totalLike += (v.digg_count || 0);
            totalCmt  += (v.comment_count || 0);
            totalSave += (v.collect_count || 0);
            totalShare += (v.share_count || 0);
        });

        const count = videos.length;
        const fmt = (n) => n.toLocaleString('vi-VN');
        const avg = (total) => Math.round(total / count).toLocaleString('vi-VN');

        const createCard = (title, value, average) => `
            <div class="stat-card">
                <div class="stat-title">${title}</div>
                <div class="stat-value">${fmt(value)}</div>
                <div class="stat-avg">TB: ${avg(average)}</div>
            </div>
        `;

        board.innerHTML = `
            ${createCard('Lượt Xem', totalView, totalView)}
            ${createCard('Lượt Tim', totalLike, totalLike)}
            ${createCard('Bình Luận', totalCmt, totalCmt)}
            ${createCard('Lượt Lưu', totalSave, totalSave)}
            ${createCard('Chia Sẻ', totalShare, totalShare)}
        `;
        board.style.display = 'grid';
    }

    // Button Handler
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const rawInput = document.getElementById('username').value;
      const limit = parseInt(document.getElementById('limit').value);
      const output = document.getElementById('output');
      const dlBtn = document.getElementById('downloadCsvBtn');
      const statsBoard = document.getElementById('stats-board');

      if (!rawInput) return alert('Vui lòng nhập Link Kênh hoặc ID!');
      
      document.getElementById('fetchBtn').disabled = true;
      dlBtn.disabled = true;
      output.innerHTML = '';
      statsBoard.style.display = 'none';
      currentData = []; 

      try {
        const result = await fetchTikTokVideos(rawInput, limit);
        const videos = result.videos;
        const finalUsername = result.realUsername;
        currentData = videos; 
        
        log(`✅ Yeah! Đã lấy thành công ${videos.length} video.`, 'success');
        
        renderStats(videos);
        renderTable(videos, finalUsername);
        
        dlBtn.disabled = false;
      } catch (e) {
        log(`❌ Oops! Lỗi: ${e.message}`, 'error');
      } finally {
        document.getElementById('fetchBtn').disabled = false;
      }
    });

    function renderTable(videos, inputUsername) {
      const output = document.getElementById('output');
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>STT</th>
            <th>Ảnh</th>
            <th>Kênh</th>
            <th>Caption</th>
            <th>View</th>
            <th>Like</th>
            <th>Cmt</th>
            <th>Save</th>
            <th>Share</th>
            <th>Link</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');

      videos.forEach((v, index) => {
        const tr = document.createElement('tr');
        const authorName = v.author ? v.author.unique_id : inputUsername;
        const caption = v.title || '-';
        const coverUrl = v.origin_cover || v.cover || '';

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td class="col-thumb">${coverUrl ? `<img src="${coverUrl}" loading="lazy">` : ''}</td>
          <td>${authorName}</td>
          <td class="col-caption" title="${caption.replace(/"/g, '&quot;')}">${caption}</td>
          <td>${(v.play_count||0).toLocaleString()}</td>
          <td>${(v.digg_count||0).toLocaleString()}</td>
          <td>${(v.comment_count||0).toLocaleString()}</td>
          <td>${(v.collect_count||0).toLocaleString()}</td>
          <td>${(v.share_count||0).toLocaleString()}</td>
          <td><a href="https://www.tiktok.com/@${authorName}/video/${v.video_id}" target="_blank">Xem</a></td>
          <td><span class="col-status">OK</span></td>
        `;
        tbody.appendChild(tr);
      });
      output.appendChild(table);
    }

    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
        if (!currentData.length) return;
        
        const fileUsername = currentData[0]?.author?.unique_id || 'tiktok_data';
        
        const headers = ['STT', 'Link Anh', 'Kenh', 'Caption', 'View', 'Like', 'Comment', 'Save', 'Share', 'Link Video', 'Trang thai'];
        
        const rows = currentData.map((v, index) => {
            const authorName = v.author ? v.author.unique_id : fileUsername;
            const caption = (v.title || '').replace(/(\r\n|\n|\r)/gm, ' ').replace(/"/g, '""');
            
            return [
                index + 1,
                v.origin_cover || v.cover || '',
                authorName,
                `"${caption}"`,
                v.play_count || 0,
                v.digg_count || 0,
                v.comment_count || 0,
                v.collect_count || 0,
                v.share_count || 0,
                `https://www.tiktok.com/@${authorName}/video/${v.video_id}`,
                'OK'
            ];
        });

        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `TikTok_${fileUsername}_${new Date().getTime()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
  </script>
</body>
</html>
