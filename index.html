<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Scanner V20 (CodeTabs Tunnel)</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* GIAO DIỆN TỐI ƯU HÓA */
    :root { --p:#ff0050; --s:#00f2ea; --bg:#111; --card:#222; --text:#fff; }
    body { font-family:'Be Vietnam Pro',sans-serif; background:var(--bg); color:var(--text); padding:20px; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
    
    main { width:100%; max-width:1100px; background:var(--card); border:1px solid #333; box-shadow:0 0 20px rgba(0,242,234,0.1); border-radius:20px; padding:30px; }
    
    h1 { font-family:'Fredoka',sans-serif; color:var(--p); text-align:center; font-size: 32px; margin-bottom: 5px; }
    p.sub { text-align: center; color: #777; font-size: 13px; margin-bottom: 30px; }

    .control-box { display:grid; grid-template-columns: 2fr 1fr auto auto; gap:10px; background:#333; padding:15px; border-radius:12px; }
    
    input { background:#222; border:1px solid #555; color:#fff; padding:12px; border-radius:8px; font-weight:bold; outline:none; }
    input:focus { border-color:var(--s); }
    
    button { padding:0 25px; border-radius:8px; font-weight:700; cursor:pointer; border:none; transition:0.2s; }
    #fetchBtn { background:var(--s); color:#000; }
    #fetchBtn:hover { transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,242,234,0.3); }
    #dl { background:var(--p); color:#fff; }
    button:disabled { background:#555; color:#888; cursor:not-allowed; transform:none; box-shadow:none; }

    /* LOG & STATS */
    #log { margin:20px 0; padding:10px; text-align:center; border-radius:8px; font-size:14px; display:none; }
    .success { background:#00c853; color:#000; } .error { background:#d50000; color:#fff; } .info { background:#2962ff; color:#fff; }

    #stats { display:none; grid-template-columns:repeat(4,1fr); gap:15px; margin-bottom:20px; }
    .stat-card { background:#333; padding:15px; text-align:center; border-radius:10px; border:1px solid #444; }
    .stat-card h4 { margin:0 0 5px 0; font-size:11px; color:#aaa; text-transform:uppercase; }
    .stat-card div { font-size:20px; font-weight:800; color:var(--s); }

    /* TABLE */
    .tbl-box { overflow-x:auto; border:1px solid #444; border-radius:10px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:#444; color:var(--s); padding:12px; text-align:left; white-space:nowrap; }
    td { padding:10px; border-bottom:1px solid #333; }
    img { width:45px; height:45px; object-fit:cover; border-radius:6px; border:1px solid #555; }
    a { color:var(--p); text-decoration:none; }

    @media(max-width:768px){ .control-box{ grid-template-columns:1fr; } #stats{ grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>

  <main>
    <h1>TikTok Scanner V20</h1>
    <p class="sub">Giải pháp cuối cùng: CodeTabs Tunneling (Bypass Cloudflare)</p>

    <div class="control-box">
      <input id="u" placeholder="ID TikTok (vd: letuankhang2002)" value="letuankhang2002" />
      <input id="n" type="number" value="10" min="1" max="30" placeholder="Số lượng" />
      <button id="fetchBtn">🚀 QUÉT DATA</button>
      <button id="dl" disabled>💾 EXCEL</button>
    </div>

    <div id="log"></div>
    <div id="stats"></div>
    <div class="tbl-box"><div id="out"></div></div>
  </main>

  <script>
    // Cấu hình Proxy CodeTabs (Đây là chìa khóa)
    const PROXY_BASE = "https://api.codetabs.com/v1/proxy?quest=";
    
    let currentData = [];
    const logEl = document.getElementById('log');
    
    function log(msg, type) {
        logEl.textContent = msg;
        logEl.className = type;
        logEl.style.display = 'block';
    }

    async function fetchData(username, count) {
        // TikWM API URL
        const targetUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=${count}&cursor=0`;
        
        // Ghép với CodeTabs Proxy
        // encodeURIComponent là bắt buộc để mã hóa URL
        const finalUrl = PROXY_BASE + encodeURIComponent(targetUrl);

        try {
            const res = await fetch(finalUrl);
            
            // CodeTabs đôi khi trả về JSON, đôi khi trả về text
            const text = await res.text();
            
            // Kiểm tra xem có phải JSON hợp lệ không
            let json;
            try {
                json = JSON.parse(text);
            } catch (e) {
                // Nếu không parse được JSON, có thể Proxy trả về lỗi HTML
                throw new Error("Proxy phản hồi dữ liệu không đúng định dạng (HTML Error).");
            }

            // Kiểm tra Logic TikWM
            if (json.code === -1) {
                // Code -1 thường là do ID sai hoặc IP bị chặn tạm thời
                throw new Error("TikWM từ chối truy cập (IP Blocked/Wrong ID).");
            }
            
            if (!json.data || !json.data.videos) {
                throw new Error("Không tìm thấy video nào.");
            }

            return json.data.videos;

        } catch (e) {
            console.error(e);
            throw new Error("Lỗi kết nối: " + e.message);
        }
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
        const u = document.getElementById('u').value.trim();
        const n = parseInt(document.getElementById('n').value);
        if(!u) return alert("Nhập ID!");

        // Reset UI
        const btn = document.getElementById('fetchBtn');
        btn.disabled = true;
        document.getElementById('dl').disabled = true;
        document.getElementById('out').innerHTML = '';
        document.getElementById('stats').style.display = 'none';
        log("⏳ Đang đi xuyên qua 'CodeTabs Tunnel'...", "info");

        try {
            const videos = await fetchData(u, n);
            
            // Cắt đúng số lượng
            const finalVideos = videos.slice(0, n);
            currentData = finalVideos;

            renderStats(finalVideos);
            renderTable(finalVideos);
            log(`✅ THÀNH CÔNG! Lấy được ${finalVideos.length} video.`, "success");
            document.getElementById('dl').disabled = false;

        } catch (e) {
            log(`❌ THẤT BẠI: ${e.message}`, "error");
            
            // Fallback gợi ý
            setTimeout(() => {
                if(confirm("Hệ thống tự động thất bại do bảo mật cao. Bạn có muốn mở dữ liệu gốc để copy thủ công không?")) {
                   window.open(`https://www.tikwm.com/api/user/posts?unique_id=${u}&count=30`, '_blank');
                }
            }, 1000);
        } finally {
            btn.disabled = false;
        }
    });

    function renderStats(list) {
        let t={v:0,l:0,c:0,s:0};
        list.forEach(v=>{ t.v+=v.play_count; t.l+=v.digg_count; t.c+=v.comment_count; t.s+=v.share_count; });
        const f=n=>n.toLocaleString('vi-VN');
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><h4>View</h4><div>${f(t.v)}</div></div>
            <div class="stat-card"><h4>Tim</h4><div>${f(t.l)}</div></div>
            <div class="stat-card"><h4>Comment</h4><div>${f(t.c)}</div></div>
            <div class="stat-card"><h4>Share</h4><div>${f(t.s)}</div></div>
        `;
        document.getElementById('stats').style.display = 'grid';
    }

    function renderTable(list) {
        let h = '<table><thead><tr><th>#</th><th>Thumb</th><th>Caption</th><th>View</th><th>Like</th><th>Share</th><th>Link</th></tr></thead><tbody>';
        list.forEach((v,i) => {
            h += `<tr>
                <td>${i+1}</td>
                <td><img src="${v.cover}"></td>
                <td>${(v.title||'-').substring(0,50)}</td>
                <td style="color:var(--s)">${v.play_count.toLocaleString()}</td>
                <td>${v.digg_count.toLocaleString()}</td>
                <td>${v.share_count.toLocaleString()}</td>
                <td><a href="https://www.tiktok.com/@${v.author.unique_id}/video/${v.video_id}" target="_blank">Xem</a></td>
            </tr>`;
        });
        h += '</tbody></table>';
        document.getElementById('out').innerHTML = h;
    }

    document.getElementById('dl').addEventListener('click', () => {
        if(!currentData.length) return;
        const u = document.getElementById('u').value;
        const csv = "\uFEFFSTT,LinkAnh,Caption,View,Tim,Comment,Share,LinkVideo\n" + 
            currentData.map((v,i) => `${i+1},${v.cover},"${(v.title||'').replace(/"/g,'""')}",${v.play_count},${v.digg_count},${v.comment_count},${v.share_count},https://www.tiktok.com/@${v.author.unique_id}/video/${v.video_id}`).join('\n');
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
        a.download = `TikTok_${u}.csv`;
        a.click();
    });
  </script>
</body>
</html>
