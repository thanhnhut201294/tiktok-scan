<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Scanner (Direct Browser Mode)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; padding:20px; background:#f4f5f7; color:#333; }
    main { max-width:900px; margin: 0 auto; background: #fff; padding: 25px; border-radius:12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { margin-top:0; text-align: center; color: #fe2c55; display: flex; align-items: center; justify-content: center; gap: 10px;}
    
    .input-group { margin-bottom: 15px; }
    label { font-weight: 600; margin-bottom: 5px; display: block; font-size: 14px;}
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    input:focus { outline: none; border-color: #fe2c55; }
    
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor:pointer; font-weight: 700; font-size: 16px; transition: 0.2s; }
    #fetchBtn { background:#fe2c55; color:#fff; }
    #fetchBtn:hover { background:#e0244a; }
    #fetchBtn:disabled { background:#ccc; cursor: not-allowed; }
    #downloadCsvBtn { background:#00c0b6; color:#fff; }
    #downloadCsvBtn:disabled { background:#e0e0e0; color:#999; cursor:not-allowed; }

    /* Logger */
    #status { margin-top:15px; padding: 10px; border-radius: 6px; background: #f0f0f0; font-family: monospace; font-size: 13px; min-height: 40px; white-space: pre-wrap; }
    .log-info { color: #0056b3; }
    .log-success { color: #008000; font-weight: bold; }
    .log-error { color: #d32f2f; }
    .log-warn { color: #e65100; }

    /* Table */
    .table-responsive { overflow-x: auto; margin-top: 20px; border-radius: 8px; border: 1px solid #eee; }
    table { width:100%; border-collapse:collapse; min-width: 700px; }
    th, td { border-bottom:1px solid #eee; padding:12px 15px; text-align:left; font-size:14px;}
    th { background:#f9f9f9; color: #555; font-weight: 600; white-space: nowrap; }
    td img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; vertical-align: middle; margin-right: 10px; }
    a { color: #fe2c55; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1><span>🎬</span> TikTok Scanner</h1>
    
    <div id="form">
      <div class="input-group">
        <label>Username (ID không có @)</label>
        <input id="username" placeholder="vd: tiktokvn, datvilla94..." />
      </div>
      <div class="input-group">
        <label>Số lượng muốn lấy</label>
        <input id="limit" type="number" value="30" min="1" placeholder="Số lượng..." />
      </div>
      
      <div class="actions">
        <button id="fetchBtn">Bắt đầu quét</button>
        <button id="downloadCsvBtn" disabled>Tải Excel</button>
      </div>
    </div>

    <div id="status">Sẵn sàng.</div>
    <div id="output" class="table-responsive"></div>
  </main>

  <script>
    // --- CẤU HÌNH ---
    const PROXY_LIST = [
        // Ưu tiên 1: CodeTabs (Thường ổn định nhất cho JSON)
        { url: 'https://api.codetabs.com/v1/proxy?quest=', type: 'direct' },
        // Ưu tiên 2: AllOrigins (Trả về JSON bọc trong contents)
        { url: 'https://api.allorigins.win/get?url=', type: 'wrapped' },
        // Ưu tiên 3: CorsProxy.io (Chỉ chạy được từ Browser, ko chạy đc từ Worker)
        { url: 'https://corsproxy.io/?', type: 'direct' }
    ];

    function log(msg, type = 'info') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `log-${type}`;
    }

    // Hàm gọi API thông minh: Thử từng Proxy cho đến khi được
    async function smartFetch(targetUrl) {
        let lastError = null;

        for (const proxy of PROXY_LIST) {
            try {
                const finalUrl = proxy.url + encodeURIComponent(targetUrl);
                log(`Đang thử kết nối qua kênh: ${new URL(proxy.url).hostname}...`, 'info');
                
                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                
                let data;
                if (proxy.type === 'wrapped') {
                    const temp = await res.json();
                    if(!temp.contents) throw new Error("Proxy không trả về nội dung");
                    // AllOrigins trả về text trong 'contents', cần parse lại
                    data = JSON.parse(temp.contents);
                } else {
                    data = await res.json();
                }

                // Kiểm tra logic TikWM
                if (data.code === -1) {
                    throw new Error(`Proxy ${new URL(proxy.url).hostname} bị TikWM chặn (Limit).`);
                }
                
                return data; // Thành công -> Thoát vòng lặp trả về data
            } catch (e) {
                console.warn(`Proxy ${proxy.url} thất bại:`, e.message);
                lastError = e;
                // Thử proxy tiếp theo...
            }
        }
        throw new Error("Tất cả các kênh đều thất bại. Vui lòng thử lại sau 10 phút.");
    }

    // Logic chính
    async function fetchTikTokVideos(username, maxVideos) {
      const allVideos = [];
      const processedIds = new Set();
      let cursor = 0;
      let hasMore = true;

      while (hasMore) {
        log(`Đang tải dữ liệu... Đã lấy: ${allVideos.length}/${maxVideos}`, 'info');

        const targetUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=30&cursor=${cursor}`;
        
        // Gọi hàm Smart Fetch thay vì fetch thường
        const data = await smartFetch(targetUrl);
        
        if (!data?.data?.videos) {
            if(allVideos.length === 0) throw new Error('Không tìm thấy video nào (User Private hoặc không tồn tại)');
            break;
        }

        for (const v of data.data.videos) {
          if (!v.video_id || processedIds.has(v.video_id)) continue;
          if (allVideos.length >= maxVideos) { hasMore = false; break; }
          allVideos.push(v);
          processedIds.add(v.video_id);
        }

        cursor = data.data.cursor;
        
        if (!data.data.hasMore || allVideos.length >= maxVideos) {
             hasMore = false;
        } else {
             // Delay 1.5 giây để an toàn
             await new Promise(r => setTimeout(r, 1500)); 
        }
      }
      return allVideos;
    }

    // UI Handlers
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const limit = parseInt(document.getElementById('limit').value);
      const output = document.getElementById('output');
      const btn = document.getElementById('fetchBtn');
      const dlBtn = document.getElementById('downloadCsvBtn');

      if (!username || !limit) { alert('Vui lòng nhập đủ thông tin!'); return; }
      
      // Reset
      output.innerHTML = '';
      dlBtn.disabled = true;
      btn.disabled = true;
      
      try {
        const videos = await fetchTikTokVideos(username, limit);
        log(`✅ Thành công! Đã lấy ${videos.length} video.`, 'success');
        renderTable(videos, username);
        prepareCsvDownload(videos, username);
      } catch (e) {
        log(`❌ Lỗi: ${e.message}`, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    function renderTable(videos, username) {
      const output = document.getElementById('output');
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>Video</th>
            <th width="40%">Caption</th>
            <th>Ngày đăng</th>
            <th>Views</th>
            <th>Tim</th>
            <th>Comment</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');
      videos.forEach(v => {
        const tr = document.createElement('tr');
        const cover = v.cover ? `<img src="${v.cover}">` : '';
        tr.innerHTML = `
          <td>
            ${cover}
            <a href="https://www.tiktok.com/@${username}/video/${v.video_id}" target="_blank">Link</a>
          </td>
          <td>${(v.title || '-').substring(0, 100)}</td>
          <td>${new Date(v.create_time * 1000).toLocaleString('vi-VN')}</td>
          <td>${(v.play_count||0).toLocaleString()}</td>
          <td>${(v.digg_count||0).toLocaleString()}</td>
          <td>${(v.comment_count||0).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
      output.appendChild(table);
    }

    function prepareCsvDownload(videos, username) {
      const rows = [['Video URL','Caption','Date','Views','Likes','Comments','Shares']];
      videos.forEach(v => {
        rows.push([
          `https://www.tiktok.com/@${username}/video/${v.video_id}`,
          `"${(v.title||'').replace(/"/g,'""').replace(/(\r\n|\n|\r)/gm,' ')}"`,
          new Date(v.create_time * 1000).toLocaleString('vi-VN'),
          v.play_count||0, v.digg_count||0, v.comment_count||0, v.share_count||0
        ]);
      });
      const csv = "\uFEFF" + rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const dl = document.getElementById('downloadCsvBtn');
      dl.href = url;
      dl.download = `TikTok_${username}.csv`;
      dl.disabled = false;
    }
  </script>
</body>
</html>
