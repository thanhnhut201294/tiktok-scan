<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Data Boomerang V22</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ea; --secondary: #ff0050; --bg: #111; --card: #222; --text: #fff; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .container { width: 100%; max-width: 1000px; }
        
        /* HEADER & CONFIG */
        .header-box { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: var(--secondary); margin: 0 0 10px 0; }
        .setup-area { background: #1a1a1a; padding: 15px; border-radius: 10px; border: 2px dashed #444; margin: 20px 0; text-align: left; }
        
        .bookmark-btn {
            display: inline-block; background: #000; color: var(--primary);
            text-decoration: none; font-weight: 800; padding: 10px 20px;
            border-radius: 50px; border: 2px solid var(--primary);
            cursor: grab; margin-top: 10px; box-shadow: 0 0 10px rgba(0,242,234,0.2);
        }
        
        /* CONTROL PANEL */
        .control-panel { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #333; color: #fff; font-weight: bold; outline: none; }
        button { padding: 0 30px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; transition: 0.2s; }
        #openBtn { background: var(--primary); color: #000; }
        #openBtn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,242,234,0.3); }
        #dlBtn { background: var(--secondary); color: #fff; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }

        /* STATUS & LOGS */
        #status { text-align: center; margin-bottom: 20px; font-weight: bold; min-height: 24px; color: #aaa; }
        .pulse { animation: pulse 1.5s infinite; color: var(--primary) !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* TABLE */
        .table-box { overflow-x: auto; background: var(--card); border-radius: 15px; border: 1px solid #333; padding: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #333; color: var(--primary); padding: 15px; text-align: left; white-space: nowrap; }
        td { padding: 12px 15px; border-bottom: 1px solid #333; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #444; }
        a { color: var(--secondary); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>TikTok Boomerang V22 🪃</h1>
        <p>Mở TikTok -> Bấm nút -> Dữ liệu tự bay về đây!</p>

        <div class="setup-area">
            <strong>⚙️ CÀI ĐẶT (Làm 1 lần):</strong> Kéo nút bên dưới lên thanh dấu trang (Bookmarks Bar).
            <div style="text-align: center;">
                <a class="bookmark-btn" href="javascript:(function(){
                    /* --- BOOMERANG SCRIPT --- */
                    try {
                        if(!window.opener) {
                             alert('⚠️ LỖI: Bạn phải mở trang này TỪ trang Web Tool (Bấm nút MỞ KÊNH). Không được mở trực tiếp!');
                             return;
                        }
                        
                        /* LẤY DỮ LIỆU */
                        var data = [];
                        var script1 = document.getElementById('__UNIVERSAL_DATA_FOR_REHYDRATION__');
                        var script2 = document.getElementById('SIGI_STATE');
                        
                        if(script1) {
                            var json = JSON.parse(script1.textContent);
                            var userModule = json.__DEFAULT_SCOPE__['webapp.user-detail'];
                            if(userModule && userModule.itemList) data = userModule.itemList;
                        } 
                        
                        if(data.length === 0 && script2) {
                            var json = JSON.parse(script2.textContent);
                            if(json.ItemModule) data = Object.values(json.ItemModule);
                        }

                        if(data.length === 0) {
                            alert('❌ Chưa tìm thấy video. Hãy cuộn chuột xuống một chút rồi bấm lại!');
                            return;
                        }

                        /* CHUẨN HÓA DỮ LIỆU */
                        var cleanData = data.map(v => ({
                            id: v.id,
                            desc: (v.desc||'').replace(/\n/g,' '),
                            cover: v.video.cover,
                            stats: v.stats,
                            author: v.author
                        }));

                        /* GỬI VỀ TRANG MẸ */
                        window.opener.postMessage({ type: 'TIKTOK_DATA', data: cleanData }, '*');
                        
                        /* THÔNG BÁO VÀ ĐÓNG */
                        // alert('✅ Đã gửi ' + data.length + ' video về Tool!');
                        // window.close(); // Tự đóng tab nếu muốn (Trình duyệt có thể chặn)

                    } catch(e) { alert('Lỗi: ' + e.message); }
                })();" title="Kéo lên thanh Bookmark">🚀 GỬI DATA VỀ TOOL</a>
            </div>
        </div>
    </div>

    <div class="control-panel">
        <input id="u" type="text" placeholder="Nhập ID TikTok (Ví dụ: letuankhang2002)" value="letuankhang2002">
        <button id="openBtn">📂 1. MỞ KÊNH</button>
        <button id="dlBtn" disabled>💾 2. TẢI EXCEL</button>
    </div>

    <div id="status">Sẵn sàng. Hãy nhập ID và bấm Mở Kênh.</div>

    <div class="table-box">
        <div id="out"></div>
    </div>
</div>

<script>
    let currentData = [];
    const statusEl = document.getElementById('status');
    const uInput = document.getElementById('u');

    // 1. MỞ TRANG TIKTOK
    document.getElementById('openBtn').addEventListener('click', () => {
        const u = uInput.value.trim();
        if(!u) return alert("Nhập ID!");
        
        statusEl.innerHTML = "⏳ Đang đợi dữ liệu từ tab TikTok... (Hãy sang tab đó và bấm Bookmarklet)";
        statusEl.className = "pulse";
        
        // Mở tab mới
        window.open(`https://www.tiktok.com/@${u}`, '_blank');
    });

    // 2. LẮNG NGHE DỮ LIỆU TRẢ VỀ (BOOMERANG)
    window.addEventListener('message', (event) => {
        // Kiểm tra xem có phải data từ TikTok không
        if (event.data && event.data.type === 'TIKTOK_DATA') {
            const videos = event.data.data;
            
            // Xử lý dữ liệu
            currentData = videos;
            renderTable(videos);
            
            statusEl.innerHTML = `✅ Đã nhận thành công ${videos.length} video!`;
            statusEl.className = "";
            document.getElementById('dlBtn').disabled = false;
            
            // Có thể play âm thanh thông báo nếu muốn
            // new Audio('ding.mp3').play();
        }
    });

    function renderTable(list) {
        let h = '<table><thead><tr><th>#</th><th>Thumb</th><th>Caption</th><th>View</th><th>Tim</th><th>Cmt</th><th>Share</th><th>Link</th></tr></thead><tbody>';
        list.forEach((v,i) => {
            const author = typeof v.author === 'string' ? v.author : v.author.uniqueId;
            h += `<tr>
                <td>${i+1}</td>
                <td><img src="${v.cover}"></td>
                <td>${(v.desc||'-').substring(0,60)}</td>
                <td style="color:#00f2ea;font-weight:bold">${v.stats.playCount.toLocaleString()}</td>
                <td>${v.stats.diggCount.toLocaleString()}</td>
                <td>${v.stats.commentCount.toLocaleString()}</td>
                <td>${v.stats.shareCount.toLocaleString()}</td>
                <td><a href="https://www.tiktok.com/@${author}/video/${v.id}" target="_blank">Xem</a></td>
            </tr>`;
        });
        h += '</tbody></table>';
        document.getElementById('out').innerHTML = h;
    }

    // 3. TẢI EXCEL
    document.getElementById('dlBtn').addEventListener('click', () => {
        if(!currentData.length) return;
        const u = uInput.value;
        const csv = "\uFEFFSTT,LinkAnh,Caption,View,Tim,Comment,Share,LinkVideo\n" + 
            currentData.map((v,i) => {
                const author = typeof v.author === 'string' ? v.author : v.author.uniqueId;
                return `${i+1},${v.cover},"${(v.desc||'').replace(/"/g,'""')}",${v.stats.playCount},${v.stats.diggCount},${v.stats.commentCount},${v.stats.shareCount},https://www.tiktok.com/@${author}/video/${v.id}`;
            }).join('\n');
            
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `TikTok_${u}_${Date.now()}.csv`;
        link.click();
    });
</script>

</body>
</html>
