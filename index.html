<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Get Video From Channel V2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff0050;
      --secondary: #00f2ea;
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-color: #000000;
      --border-width: 3px;
      --shadow-offset: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#000 1px, transparent 1px);
      background-size: 20px 20px;
      color: #000;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* NAV */
    .top-nav {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .home-btn {
      text-decoration: none;
      background: #fff;
      color: #000;
      font-weight: 700;
      padding: 10px 25px;
      border: var(--border-width) solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      border-radius: 50px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .home-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0px var(--border-color); background: var(--secondary); }
    .home-btn:active { transform: translate(2px,2px); box-shadow: none; }

    /* MAIN */
    main {
      width: 100%;
      max-width: 1400px;
      background: var(--card-bg);
      border: var(--border-width) solid var(--border-color);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 38px;
      text-align: center;
      color: var(--primary);
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 3px 3px 0px #000;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    /* CONTROLS */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
      background: #fff;
      padding: 20px;
      border: 2px dashed #000;
      border-radius: 15px;
    }

    .input-group { display: flex; flex-direction: column; }

    label {
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 14px;
      color: #000;
      text-transform: uppercase;
    }

    .hint { font-size: 12px; color: #666; font-weight: 500; text-transform: none; }

    input, button, select { font-family: 'Be Vietnam Pro', sans-serif; }

    input {
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--border-color);
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      background-color: #e0f7fa;
      transform: translate(-2px,-2px);
      box-shadow: 5px 5px 0px var(--border-color);
      border-color: var(--primary);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    button {
      padding: 0 24px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: all 0.15s ease;
      height: 52px;
      white-space: nowrap;
      text-transform: uppercase;
      flex: 1;
    }
    button:hover:not(:disabled) { transform: translate(-3px,-3px); box-shadow: 6px 6px 0px var(--border-color); }
    button:active:not(:disabled) { transform: translate(2px,2px); box-shadow: none; }
    button:disabled { background-color: #ddd; color: #888; border-color: #999; box-shadow: none; cursor: not-allowed; transform: none; }

    #fetchBtn   { background-color: var(--primary); color: #fff; }
    #stopBtn    { background-color: #ff8800; color: #fff; display: none; }
    #downloadCsvBtn { background-color: var(--secondary); color: #000; }
    #copySheetBtn   { background-color: #34a853; color: #fff; }

    /* PROGRESS */
    .progress-wrap {
      display: none;
      height: 18px;
      background: #fff;
      border: 2px solid #000;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 2px 2px 0 #000;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: repeating-linear-gradient(45deg, var(--secondary), var(--secondary) 10px, #00c4bd 10px, #00c4bd 20px);
      border-right: 2px solid #000;
      transition: width 0.3s ease;
    }

    /* STATUS */
    #status {
      margin-bottom: 25px;
      padding: 15px 20px;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      background: #f8f8f8;
      font-weight: 600;
      box-shadow: 4px 4px 0px #ccc;
      min-height: 52px;
      display: flex;
      align-items: center;
      font-size: 15px;
    }
    .log-loading { color: #007bff; background: #e8f4ff !important; border-color: #007bff !important; }
    .log-success { color: #009944; background: #e8f5e9 !important; border-color: #009944 !important; box-shadow: 4px 4px 0 #005c29 !important; }
    .log-error   { color: #ff0050; background: #ffebee !important; border-color: #ff0050 !important; box-shadow: 4px 4px 0 #b30038 !important; }

    /* STATS BOARD */
    #stats-board {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #fff;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      padding: 18px 10px;
      text-align: center;
      box-shadow: 5px 5px 0px var(--border-color);
      transition: transform 0.2s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .stat-card:hover { transform: translateY(-4px); background: #fff9fa; }
    .stat-icon  { font-size: 24px; margin-bottom: 6px; }
    .stat-title { font-size: 12px; font-weight: 700; color: #555; margin-bottom: 6px; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #000; margin-bottom: 6px; }
    .stat-avg   { font-size: 12px; font-weight: 700; background: var(--secondary); color: #000; border: 2px solid #000; border-radius: 50px; padding: 3px 10px; box-shadow: 2px 2px 0 #000; }

    /* TABLE */
    .table-wrap {
      overflow-x: auto;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      box-shadow: 6px 6px 0px var(--border-color);
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1100px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #000;
      padding: 10px 12px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      background-color: var(--secondary);
      color: #000;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      font-size: 12px;
      border-bottom: 2px solid #000;
    }
    td { font-weight: 500; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #fffde7; }

    .thumb img {
      width: 54px; height: 54px;
      object-fit: cover;
      border: 2px solid #000;
      border-radius: 8px;
      display: block;
    }
    .badge-ok  { background: #c3e6cb; color: #155724; border: 2px solid #155724; padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 11px; box-shadow: 2px 2px 0 #155724; display: inline-block; }
    .num       { font-weight: 700; color: #0075ff; }
    a.video-link { color: var(--primary); font-weight: 700; text-decoration: none; border-bottom: 2px solid transparent; transition: 0.2s; }
    a.video-link:hover { border-bottom: 2px solid var(--primary); background: #ffe6eb; }

    /* COPY TOAST */
    .copy-toast {
      display: none;
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%);
      background: #34a853; color: #fff;
      font-weight: 700; padding: 12px 28px;
      border-radius: 50px; border: 2px solid #000;
      box-shadow: 4px 4px 0 #000;
      z-index: 9999; font-size: 15px;
    }
    .copy-toast.show { display: block; animation: fadeUp 2.2s ease forwards; }
    @keyframes fadeUp {
      0%  { opacity:0; bottom:20px }
      15% { opacity:1; bottom:30px }
      75% { opacity:1; bottom:30px }
      100%{ opacity:0; bottom:40px }
    }

    @media (max-width: 1100px) { #stats-board { grid-template-columns: repeat(3,1fr); } }
    @media (max-width: 768px) {
      main { padding: 20px; }
      h1   { font-size: 26px; }
      .controls { grid-template-columns: 1fr; }
      .btn-row { flex-wrap: wrap; }
      button { flex: 1 1 45%; }
      #stats-board { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="https://thanhnhut201294.github.io/tool/" class="home-btn">
    <span>↩</span> Quay lại trang chủ
  </a>
</nav>

<main>
  <h1>📹 TikTok Get Videos V2</h1>

  <div class="controls">
    <div class="input-group">
      <label>Link Kênh / Username TikTok</label>
      <input id="username" placeholder="Ví dụ: https://www.tiktok.com/@letuankhang2002 hoặc letuankhang2002" />
    </div>
    <div class="input-group">
      <label>Số lượng video <span class="hint">(Max 48)</span></label>
      <input id="limit" type="number" value="10" min="1" max="48" />
    </div>
    <div class="btn-row" style="grid-column:1/-1">
      <button id="fetchBtn">🚀 Quét Data</button>
      <button id="stopBtn">⏹ Dừng</button>
      <button id="downloadCsvBtn" disabled>💾 Tải CSV</button>
      <button id="copySheetBtn" disabled>📋 Copy → Google Sheets</button>
    </div>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div id="status">👋 Sẵn sàng. Dán link kênh vào ô trên để bắt đầu!</div>

  <div id="stats-board"></div>
  <div id="output" class="table-wrap"></div>
</main>

<div id="copyToast" class="copy-toast">✅ Đã copy! Mở Google Sheets → Ctrl+V</div>

<script>
// ============================================================
// CONFIG
// ============================================================
let isRunning = false;
let currentData = [];

const $ = id => document.getElementById(id);

function log(msg, type = 'default') {
  const el = $('status');
  el.textContent = msg;
  el.className = `log-${type}`;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

// ============================================================
// TIKWM — gọi thẳng, không proxy
// ============================================================
async function tikwmFetch(url) {
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.code === -1) throw new Error('Rate limit / blocked');
  if (data.code !== 0) throw new Error(`TikWM lỗi: ${data.msg || data.code}`);
  return data;
}

// ============================================================
// EXTRACT USERNAME
// ============================================================
function extractUsername(input) {
  input = (input || '').trim();
  try {
    if (input.includes('tiktok.com')) {
      const m = input.match(/@([a-zA-Z0-9_.]+)/);
      return m ? m[1] : null;
    }
    if (input.startsWith('@')) return input.substring(1);
    return input || null;
  } catch(e) { return null; }
}

// ============================================================
// FETCH VIDEOS
// ============================================================
async function fetchVideos(username, limit) {
  const all = [];
  let cursor = 0;
  let hasMore = true;
  if (limit > 48) limit = 48;

  while (hasMore && all.length < limit && isRunning) {
    const url = `https://www.tikwm.com/api/user/posts?unique_id=${encodeURIComponent(username)}&count=33&cursor=${cursor}`;
    const data = await tikwmFetch(url);

    if (!data?.data?.videos || data.data.videos.length === 0) {
      if (all.length === 0) throw new Error('Kênh private hoặc không tìm thấy');
      break;
    }

    for (const v of data.data.videos) {
      if (all.length >= limit) break;
      all.push(v);
    }

    cursor = data.data.cursor;
    hasMore = data.data.hasMore;

    // Update progress bar (indeterminate style — just fill proportionally)
    const pct = Math.min((all.length / limit) * 100, 95);
    $('progressBar').style.width = pct + '%';
    log(`⏳ Đang tải... ${all.length}/${limit} video`, 'loading');

    if (hasMore && all.length < limit && isRunning) await sleep(800);
  }

  $('progressBar').style.width = '100%';
  return all;
}

// ============================================================
// RENDER STATS
// ============================================================
function renderStats(videos) {
  const board = $('stats-board');
  if (!videos.length) { board.style.display = 'none'; return; }

  let totalView=0, totalLike=0, totalCmt=0, totalSave=0, totalShare=0;
  videos.forEach(v => {
    totalView  += v.play_count    || 0;
    totalLike  += v.digg_count    || 0;
    totalCmt   += v.comment_count || 0;
    totalSave  += v.collect_count || 0;
    totalShare += v.share_count   || 0;
  });

  const c = videos.length;
  const fmt = n => n.toLocaleString('vi-VN');
  const avg = t => Math.round(t/c).toLocaleString('vi-VN');

  const card = (icon, title, total) => `
    <div class="stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-title">${title}</div>
      <div class="stat-value">${fmt(total)}</div>
      <div class="stat-avg">TB: ${avg(total)}</div>
    </div>`;

  board.innerHTML =
    card('👁️', 'Lượt Xem',   totalView)  +
    card('❤️', 'Lượt Tim',   totalLike)  +
    card('💬', 'Bình Luận',  totalCmt)   +
    card('🔁', 'Chia Sẻ',   totalShare) +
    card('🔖', 'Lượt Lưu',  totalSave);

  board.style.display = 'grid';
}

// ============================================================
// RENDER TABLE
// Thứ tự cột: STT | Ảnh | Kênh | Caption | View | ER% | Tim | Cmt | Share | Save | Link | Status
// ============================================================
function renderTable(videos, username) {
  const wrap = $('output');
  wrap.innerHTML = '';
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>#</th>
        <th>Ảnh</th>
        <th>Kênh</th>
        <th>Caption</th>
        <th>Lượt Xem 👁️</th>
        <th>ER% 📊</th>
        <th>Tim ❤️</th>
        <th>Bình Luận 💬</th>
        <th>Chia Sẻ 🔁</th>
        <th>Lưu 🔖</th>
        <th>Link Video</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>`;

  const tbody = table.querySelector('tbody');

  videos.forEach((v, i) => {
    const author    = v.author?.unique_id || username;
    const caption   = v.title || '-';
    const cover     = v.origin_cover || v.cover || '';
    const view      = v.play_count    || 0;
    const like      = v.digg_count    || 0;
    const cmt       = v.comment_count || 0;
    const share     = v.share_count   || 0;
    const save      = v.collect_count || 0;
    const interact  = like + cmt + share + save;
    const er        = view > 0 ? ((interact / view) * 100).toFixed(2) : '0.00';
    const fmt       = n => n.toLocaleString('vi-VN');
    const videoLink = `https://www.tiktok.com/@${author}/video/${v.video_id}`;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${i+1}</td>
      <td class="thumb">${cover ? `<img src="${cover}" loading="lazy">` : '—'}</td>
      <td style="white-space:nowrap">@${author}</td>
      <td style="max-width:260px;word-break:break-word;font-size:12px">${caption}</td>
      <td class="num">${fmt(view)}</td>
      <td><span style="background:#fff3cd;border:1px solid #000;padding:2px 7px;border-radius:6px;font-weight:700;font-size:12px">${er}%</span></td>
      <td class="num">${fmt(like)}</td>
      <td class="num">${fmt(cmt)}</td>
      <td class="num">${fmt(share)}</td>
      <td class="num">${fmt(save)}</td>
      <td><a class="video-link" href="${videoLink}" target="_blank">🔗 Xem</a></td>
      <td><span class="badge-ok">OK</span></td>`;
    tbody.appendChild(tr);
  });

  wrap.appendChild(table);
}

// ============================================================
// MAIN BUTTON
// ============================================================
$('fetchBtn').addEventListener('click', async () => {
  const rawInput = $('username').value.trim();
  const limit    = Math.min(parseInt($('limit').value) || 10, 48);
  const username = extractUsername(rawInput);

  if (!username) { alert('Vui lòng nhập Link Kênh hoặc Username hợp lệ!'); return; }

  isRunning = true;
  currentData = [];
  $('output').innerHTML = '';
  $('stats-board').style.display = 'none';
  $('fetchBtn').style.display  = 'none';
  $('stopBtn').style.display   = 'inline-block';
  $('downloadCsvBtn').disabled = true;
  $('copySheetBtn').disabled   = true;
  $('progressBar').style.width = '0%';
  $('.progress-wrap' + '').style.display; // trick — use querySelector below
  document.querySelector('.progress-wrap').style.display = 'block';

  log(`⏳ Bắt đầu quét @${username}...`, 'loading');

  try {
    const videos = await fetchVideos(username, limit);
    currentData  = videos;

    if (!videos.length) throw new Error('Không tìm thấy video nào. Kênh có thể private.');

    log(`✅ Lấy thành công ${videos.length} video từ @${username}`, 'success');
    renderStats(videos);
    renderTable(videos, username);

    $('downloadCsvBtn').disabled = false;
    $('copySheetBtn').disabled   = false;
  } catch(e) {
    log(`❌ Lỗi: ${e.message}`, 'error');
  } finally {
    isRunning = false;
    $('fetchBtn').style.display = 'inline-block';
    $('stopBtn').style.display  = 'none';
  }
});

$('stopBtn').addEventListener('click', () => {
  isRunning = false;
  log('⛔ Đã dừng.', 'error');
  $('fetchBtn').style.display = 'inline-block';
  $('stopBtn').style.display  = 'none';
  if (currentData.length) {
    $('downloadCsvBtn').disabled = false;
    $('copySheetBtn').disabled   = false;
  }
});

// ============================================================
// EXPORT — dùng chung rowToArray
// ============================================================
const CSV_HEADERS = ['STT','Username','Caption','Lượt Xem','ER%','Tim','Bình Luận','Chia Sẻ','Lưu','Link Video','Ảnh Cover','Trạng Thái'];

function rowToArray(v, i, username) {
  const author   = v.author?.unique_id || username;
  const caption  = (v.title || '').replace(/[\r\n]+/g,' ').replace(/"/g,'""');
  const view     = v.play_count    || 0;
  const like     = v.digg_count    || 0;
  const cmt      = v.comment_count || 0;
  const share    = v.share_count   || 0;
  const save     = v.collect_count || 0;
  const interact = like + cmt + share + save;
  const er       = view > 0 ? ((interact/view)*100).toFixed(2) : '0.00';
  return [
    i+1,
    author,
    `"${caption}"`,
    view, `${er}%`,
    like, cmt, share, save,
    `https://www.tiktok.com/@${author}/video/${v.video_id}`,
    v.origin_cover || v.cover || '',
    'OK'
  ];
}

$('downloadCsvBtn').addEventListener('click', () => {
  if (!currentData.length) return;
  const username = currentData[0]?.author?.unique_id || 'tiktok';
  const rows = currentData.map((v,i) => rowToArray(v,i,username).join(','));
  const csv  = [CSV_HEADERS.join(','), ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `TikTok_${username}_${Date.now()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});

$('copySheetBtn').addEventListener('click', () => {
  if (!currentData.length) return;
  const username = currentData[0]?.author?.unique_id || 'tiktok';
  const lines = [CSV_HEADERS.join('\t')];
  currentData.forEach((v,i) => {
    // TSV — bỏ dấu nháy kép, thay tab trong caption bằng space
    const row = rowToArray(v,i,username).map(c => String(c).replace(/\t/g,' ').replace(/^"|"$/g,''));
    lines.push(row.join('\t'));
  });
  const tsv = lines.join('\n');
  navigator.clipboard.writeText(tsv).then(() => {
    showToast();
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = tsv; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  });
});

function showToast() {
  const t = $('copyToast');
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2300);
}
</script>
</body>
</html>
