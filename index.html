<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Data Export Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:20px; background:#f4f5f7; color:#333; }
    main { max-width:1200px; margin: 0 auto; background: #fff; padding: 25px; border-radius:12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin-top:0; text-align: center; color: #fe2c55; display: flex; align-items: center; justify-content: center; gap: 10px;}
    
    /* Form input */
    .controls { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; margin-bottom: 20px; align-items: end;}
    .input-group { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #555;}
    input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
    input:focus { outline: none; border-color: #fe2c55; }
    
    /* Buttons */
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor:pointer; font-weight: 600; font-size: 15px; height: 42px; transition: 0.2s; white-space: nowrap;}
    #fetchBtn { background:#fe2c55; color:#fff; }
    #fetchBtn:hover { background:#e0244a; }
    #fetchBtn:disabled, #downloadCsvBtn:disabled { background:#ccc; cursor: not-allowed; opacity: 0.7;}
    #downloadCsvBtn { background:#00c0b6; color:#fff; }
    #downloadCsvBtn:hover { background:#00a098; }

    /* Logger */
    #status { margin-bottom:15px; padding: 10px; border-radius: 6px; background: #f8f9fa; font-family: monospace; font-size: 13px; min-height: 20px; color: #333; border-left: 4px solid #ddd;}
    .log-success { border-left-color: #28a745 !important; color: #155724 !important; background: #d4edda !important; }
    .log-error { border-left-color: #dc3545 !important; color: #721c24 !important; background: #f8d7da !important; }
    .log-loading { border-left-color: #007bff !important; color: #004085 !important; background: #cce5ff !important; }

    /* Table */
    .table-container { overflow-x: auto; border: 1px solid #eee; border-radius: 8px; }
    table { width:100%; border-collapse:collapse; min-width: 900px; font-size: 14px; }
    th { background:#f1f1f2; color: #161823; font-weight: 700; padding: 12px; text-align: left; white-space: nowrap; position: sticky; top: 0;}
    td { border-bottom:1px solid #f1f1f2; padding: 10px 12px; vertical-align: middle; color: #161823;}
    tr:hover { background-color: #f8f8f8; }
    
    /* Table specific columns */
    .col-thumb img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; background: #eee; }
    .col-caption { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-status { color: #28a745; font-weight: bold; font-size: 12px; }
    a { color: #fe2c55; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>TikTok Data Export</h1>
    
    <div class="controls">
      <div class="input-group">
        <label>Username (ID không có @)</label>
        <input id="username" placeholder="vd: tiktokvn, datvilla94" />
      </div>
      <div class="input-group">
        <label>Số lượng</label>
        <input id="limit" type="number" value="30" min="1" max="1000" />
      </div>
      <button id="fetchBtn">Quét Data</button>
      <button id="downloadCsvBtn" disabled>📥 Tải Excel</button>
    </div>

    <div id="status">Sẵn sàng.</div>
    <div id="output" class="table-container"></div>
  </main>

  <script>
    // === CẤU HÌNH PROXY XOAY VÒNG ===
    const PROXY_LIST = [
        { url: 'https://api.codetabs.com/v1/proxy?quest=', type: 'direct' },
        { url: 'https://api.allorigins.win/get?url=', type: 'wrapped' },
        { url: 'https://corsproxy.io/?', type: 'direct' }
    ];

    let currentData = []; // Lưu dữ liệu để xuất Excel

    function log(msg, type = 'default') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `log-${type}`;
    }

    // Hàm gọi API thông minh (Smart Fetch)
    async function smartFetch(targetUrl) {
        for (const proxy of PROXY_LIST) {
            try {
                const finalUrl = proxy.url + encodeURIComponent(targetUrl);
                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error('Network Error');
                
                let data;
                if (proxy.type === 'wrapped') {
                    const temp = await res.json();
                    if(!temp.contents) throw new Error("No contents");
                    data = JSON.parse(temp.contents);
                } else {
                    data = await res.json();
                }

                if (data.code === -1) throw new Error("Limit Reached");
                return data; 
            } catch (e) {
                // Thử proxy tiếp theo, không cần log lỗi ra ngoài
            }
        }
        throw new Error("Không thể kết nối Server. Vui lòng thử lại sau vài phút.");
    }

    // Hàm lấy dữ liệu chính
    async function fetchTikTokVideos(username, maxVideos) {
      const allVideos = [];
      const processedIds = new Set();
      let cursor = 0;
      let hasMore = true;

      while (hasMore) {
        log(`⏳ Đang tải... Đã lấy: ${allVideos.length}/${maxVideos} video`, 'loading');

        const targetUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=30&cursor=${cursor}`;
        const data = await smartFetch(targetUrl);
        
        if (!data?.data?.videos) {
            if(allVideos.length === 0) throw new Error('Không tìm thấy dữ liệu (User Private/Sai ID)');
            break;
        }

        for (const v of data.data.videos) {
          if (!v.video_id || processedIds.has(v.video_id)) continue;
          if (allVideos.length >= maxVideos) { hasMore = false; break; }
          allVideos.push(v);
          processedIds.add(v.video_id);
        }

        cursor = data.data.cursor;
        if (!data.data.hasMore || allVideos.length >= maxVideos) {
             hasMore = false;
        } else {
             await new Promise(r => setTimeout(r, 1500)); // Delay để tránh bị chặn
        }
      }
      return allVideos;
    }

    // Xử lý sự kiện nút bấm
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const limit = parseInt(document.getElementById('limit').value);
      const output = document.getElementById('output');
      const dlBtn = document.getElementById('downloadCsvBtn');

      if (!username) return alert('Nhập Username!');
      
      document.getElementById('fetchBtn').disabled = true;
      dlBtn.disabled = true;
      output.innerHTML = '';
      currentData = []; // Reset data

      try {
        const videos = await fetchTikTokVideos(username, limit);
        currentData = videos; // Lưu vào biến toàn cục để tải Excel sau
        log(`✅ Thành công! Đã lấy ${videos.length} video.`, 'success');
        renderTable(videos, username);
        dlBtn.disabled = false;
      } catch (e) {
        log(`❌ Lỗi: ${e.message}`, 'error');
      } finally {
        document.getElementById('fetchBtn').disabled = false;
      }
    });

    // Vẽ bảng kết quả (Thêm cột STT, Ảnh, Kênh, Save, Trạng thái)
    function renderTable(videos, inputUsername) {
      const output = document.getElementById('output');
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>STT</th>
            <th>Ảnh</th>
            <th>Kênh</th>
            <th>Caption</th>
            <th>View</th>
            <th>Like</th>
            <th>Comment</th>
            <th>Save</th>
            <th>Share</th>
            <th>Link video</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');

      videos.forEach((v, index) => {
        const tr = document.createElement('tr');
        // Lấy tên kênh từ data hoặc dùng input ban đầu
        const authorName = v.author ? v.author.unique_id : inputUsername;
        const caption = v.title || '(Không caption)';
        const coverUrl = v.origin_cover || v.cover || '';

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td class="col-thumb">${coverUrl ? `<img src="${coverUrl}" loading="lazy">` : ''}</td>
          <td>${authorName}</td>
          <td class="col-caption" title="${caption.replace(/"/g, '&quot;')}">${caption}</td>
          <td>${(v.play_count||0).toLocaleString()}</td>
          <td>${(v.digg_count||0).toLocaleString()}</td>
          <td>${(v.comment_count||0).toLocaleString()}</td>
          <td>${(v.collect_count||0).toLocaleString()}</td>
          <td>${(v.share_count||0).toLocaleString()}</td>
          <td><a href="https://www.tiktok.com/@${authorName}/video/${v.video_id}" target="_blank">Xem</a></td>
          <td class="col-status">OK</td>
        `;
        tbody.appendChild(tr);
      });
      output.appendChild(table);
    }

    // Xử lý tải Excel (Sửa lỗi encoding và format)
    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
        if (!currentData.length) return;
        
        const username = document.getElementById('username').value;
        
        // 1. Tạo Header
        const headers = ['STT', 'Link Anh', 'Kenh', 'Caption', 'View', 'Like', 'Comment', 'Save', 'Share', 'Link Video', 'Trang thai'];
        
        // 2. Map dữ liệu
        const rows = currentData.map((v, index) => {
            const authorName = v.author ? v.author.unique_id : username;
            const caption = (v.title || '').replace(/(\r\n|\n|\r)/gm, ' ').replace(/"/g, '""'); // Xử lý xuống dòng và dấu ngoặc kép
            
            return [
                index + 1,
                v.origin_cover || v.cover || '',
                authorName,
                `"${caption}"`, // Bọc caption trong ngoặc kép để Excel hiểu là 1 ô
                v.play_count || 0,
                v.digg_count || 0,
                v.comment_count || 0,
                v.collect_count || 0, // Chỉ số Save
                v.share_count || 0,
                `https://www.tiktok.com/@${authorName}/video/${v.video_id}`,
                'OK'
            ];
        });

        // 3. Ghép thành chuỗi CSV
        const csvContent = [
            headers.join(','), 
            ...rows.map(r => r.join(','))
        ].join('\n');

        // 4. Tạo Blob với BOM (\uFEFF) để Excel hiển thị đúng tiếng Việt
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        // 5. Tải xuống
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `TikTok_${username}_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
  </script>
</body>
</html>
