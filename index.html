<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Data Export - Green Edition</title>
  <style>
    :root {
      --primary-color: #014a1d; /* Xanh đậm chủ đạo */
      --primary-hover: #023816;
      --secondary-color: #218838; /* Xanh lá tươi hơn cho nút download */
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #333;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding:20px; background:var(--bg-color); color:var(--text-color); }
    main { max-width:1200px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius:12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    /* Header */
    h1 { margin-top:0; text-align: center; color: var(--primary-color); display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 2px solid #eee; padding-bottom: 15px;}
    
    /* Form input */
    .controls { display: grid; grid-template-columns: 1.5fr 1fr auto auto; gap: 15px; margin-bottom: 20px; align-items: end;}
    .input-group { display: flex; flex-direction: column; }
    label { font-weight: 700; margin-bottom: 5px; font-size: 13px; color: var(--primary-color);}
    .hint { font-size: 11px; color: #666; font-weight: normal; margin-left: 5px;}
    input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; transition: 0.3s;}
    input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(1, 74, 29, 0.1); }
    
    /* Buttons */
    button { padding: 10px 20px; border: none; border-radius: 6px; cursor:pointer; font-weight: 600; font-size: 15px; height: 43px; transition: 0.2s; white-space: nowrap; color: #fff;}
    
    #fetchBtn { background: var(--primary-color); }
    #fetchBtn:hover { background: var(--primary-hover); transform: translateY(-1px);}
    
    #downloadCsvBtn { background: var(--secondary-color); }
    #downloadCsvBtn:hover { background: #1e7e34; transform: translateY(-1px);}
    
    button:disabled { background:#ccc !important; cursor: not-allowed; opacity: 0.7; transform: none;}

    /* Logger */
    #status { margin-bottom:15px; padding: 12px; border-radius: 6px; background: #f8f9fa; font-family: monospace; font-size: 13px; min-height: 20px; color: #333; border-left: 4px solid #ddd;}
    .log-success { border-left-color: #28a745 !important; color: #0f5132 !important; background: #d1e7dd !important; }
    .log-error { border-left-color: #dc3545 !important; color: #842029 !important; background: #f8d7da !important; }
    .log-loading { border-left-color: var(--primary-color) !important; color: var(--primary-color) !important; background: #e9ecef !important; }

    /* Statistics Dashboard - Updated Design */
    #stats-board { display: none; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: transform 0.2s;}
    .stat-card:hover { transform: translateY(-2px); border-color: var(--primary-color); }
    
    .stat-title { font-size: 13px; text-transform: uppercase; color: #777; font-weight: 600; margin-bottom: 8px; }
    .stat-value { font-size: 18px; font-weight: 600; color: #555; margin-bottom: 8px; }
    
    /* Điều chỉnh chỉ số trung bình lớn hơn */
    .stat-avg { 
        font-size: 16px; /* Chữ to hơn */
        color: var(--primary-color); 
        font-weight: 800; /* In đậm */
        margin-top: 5px; 
        background: rgba(1, 74, 29, 0.08); /* Nền xanh nhạt */
        display: block; 
        padding: 6px 4px; 
        border-radius: 6px;
    }
    .stat-avg span { font-size: 11px; font-weight: normal; color: #666; margin-right: 3px; }

    /* Table */
    .table-container { overflow-x: auto; border: 1px solid #e0e0e0; border-radius: 8px; }
    table { width:100%; border-collapse:collapse; min-width: 900px; font-size: 14px; }
    th { background: var(--primary-color); color: #fff; font-weight: 600; padding: 12px; text-align: left; white-space: nowrap; position: sticky; top: 0;}
    td { border-bottom:1px solid #f0f0f0; padding: 10px 12px; vertical-align: middle; color: #333;}
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #f1f1f1; }
    
    .col-thumb img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
    .col-caption { max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .col-status { color: var(--secondary-color); font-weight: bold; font-size: 12px; background: #d4edda; padding: 2px 8px; border-radius: 10px; display: inline-block;}
    a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }

    /* Responsive */
    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr; }
      button { width: 100%; }
      #stats-board { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>📊 TikTok Data Export</h1>
    
    <div class="controls">
      <div class="input-group">
        <label>Username (ID TikTok)</label>
        <input id="username" placeholder="Ví dụ: letuankhang2002" value="letuankhang2002" />
      </div>
      <div class="input-group">
        <label>Số lượng <span class="hint">(Max 48)</span></label>
        <input id="limit" type="number" value="10" min="1" max="48" />
      </div>
      <button id="fetchBtn">🔍 Quét Dữ Liệu</button>
      <button id="downloadCsvBtn" disabled>📥 Xuất Excel</button>
    </div>

    <div id="stats-board"></div>

    <div id="status">Sẵn sàng.</div>
    <div id="output" class="table-container"></div>
  </main>

  <script>
    // === CẤU HÌNH PROXY XOAY VÒNG ===
    const PROXY_LIST = [
        { url: 'https://api.codetabs.com/v1/proxy?quest=', type: 'direct' },
        { url: 'https://api.allorigins.win/get?url=', type: 'wrapped' },
        { url: 'https://corsproxy.io/?', type: 'direct' }
    ];

    let currentData = []; 

    function log(msg, type = 'default') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `log-${type}`;
    }

    async function smartFetch(targetUrl) {
        for (const proxy of PROXY_LIST) {
            try {
                const finalUrl = proxy.url + encodeURIComponent(targetUrl);
                const res = await fetch(finalUrl);
                if (!res.ok) throw new Error('Network Error');
                
                let data;
                if (proxy.type === 'wrapped') {
                    const temp = await res.json();
                    if(!temp.contents) throw new Error("No contents");
                    data = JSON.parse(temp.contents);
                } else {
                    data = await res.json();
                }

                if (data.code === -1) throw new Error("Limit Reached");
                return data; 
            } catch (e) {
                // Tiếp tục thử proxy khác
            }
        }
        throw new Error("Không thể kết nối Server. Vui lòng thử lại sau vài phút.");
    }

    async function fetchTikTokVideos(username, maxVideos) {
      if (maxVideos > 48) {
          maxVideos = 48;
          document.getElementById('limit').value = 48;
          alert("Tool giới hạn lấy tối đa 48 video gần nhất để đảm bảo ổn định.");
      }

      const allVideos = [];
      const processedIds = new Set();
      let cursor = 0;
      let hasMore = true;

      while (hasMore) {
        log(`⏳ Đang tải... Đã lấy: ${allVideos.length}/${maxVideos} video`, 'loading');

        const targetUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=30&cursor=${cursor}`;
        const data = await smartFetch(targetUrl);
        
        if (!data?.data?.videos) {
            if(allVideos.length === 0) throw new Error('Không tìm thấy dữ liệu (User Private hoặc Sai ID)');
            break;
        }

        for (const v of data.data.videos) {
          if (!v.video_id || processedIds.has(v.video_id)) continue;
          if (allVideos.length >= maxVideos) { hasMore = false; break; }
          allVideos.push(v);
          processedIds.add(v.video_id);
        }

        cursor = data.data.cursor;
        if (!data.data.hasMore || allVideos.length >= maxVideos) {
             hasMore = false;
        } else {
             await new Promise(r => setTimeout(r, 1500)); 
        }
      }
      return allVideos;
    }

    // Render Stats - Điều chỉnh giao diện hiển thị
    function renderStats(videos) {
        const board = document.getElementById('stats-board');
        if (videos.length === 0) {
            board.style.display = 'none';
            return;
        }

        let totalView = 0, totalLike = 0, totalCmt = 0, totalSave = 0, totalShare = 0;

        videos.forEach(v => {
            totalView += (v.play_count || 0);
            totalLike += (v.digg_count || 0);
            totalCmt  += (v.comment_count || 0);
            totalSave += (v.collect_count || 0);
            totalShare += (v.share_count || 0);
        });

        const count = videos.length;
        const fmt = (n) => n.toLocaleString('vi-VN');
        const avg = (total) => Math.round(total / count).toLocaleString('vi-VN');

        const createCard = (title, value, average) => `
            <div class="stat-card">
                <div class="stat-title">${title}</div>
                <div class="stat-value">Tổng: ${fmt(value)}</div>
                <div class="stat-avg"><span>TB:</span>${avg(average)}</div>
            </div>
        `;

        board.innerHTML = `
            ${createCard('Lượt Xem', totalView, totalView)}
            ${createCard('Lượt Tim', totalLike, totalLike)}
            ${createCard('Bình Luận', totalCmt, totalCmt)}
            ${createCard('Lượt Lưu', totalSave, totalSave)}
            ${createCard('Chia Sẻ', totalShare, totalShare)}
        `;
        board.style.display = 'grid';
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const limit = parseInt(document.getElementById('limit').value);
      const output = document.getElementById('output');
      const dlBtn = document.getElementById('downloadCsvBtn');
      const statsBoard = document.getElementById('stats-board');

      if (!username) return alert('Vui lòng nhập Username!');
      
      document.getElementById('fetchBtn').disabled = true;
      dlBtn.disabled = true;
      output.innerHTML = '';
      statsBoard.style.display = 'none';
      currentData = []; 

      try {
        const videos = await fetchTikTokVideos(username, limit);
        currentData = videos; 
        
        log(`✅ Hoàn tất! Đã lấy thành công ${videos.length} video.`, 'success');
        
        renderStats(videos);
        renderTable(videos, username);
        
        dlBtn.disabled = false;
      } catch (e) {
        log(`❌ Lỗi: ${e.message}`, 'error');
      } finally {
        document.getElementById('fetchBtn').disabled = false;
      }
    });

    function renderTable(videos, inputUsername) {
      const output = document.getElementById('output');
      const table = document.createElement('table');
      table.innerHTML = `
        <thead>
          <tr>
            <th>STT</th>
            <th>Ảnh</th>
            <th>Kênh</th>
            <th>Caption</th>
            <th>View</th>
            <th>Like</th>
            <th>Comment</th>
            <th>Save</th>
            <th>Share</th>
            <th>Link</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');

      videos.forEach((v, index) => {
        const tr = document.createElement('tr');
        const authorName = v.author ? v.author.unique_id : inputUsername;
        const caption = v.title || '-';
        const coverUrl = v.origin_cover || v.cover || '';

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td class="col-thumb">${coverUrl ? `<img src="${coverUrl}" loading="lazy">` : ''}</td>
          <td>${authorName}</td>
          <td class="col-caption" title="${caption.replace(/"/g, '&quot;')}">${caption}</td>
          <td>${(v.play_count||0).toLocaleString()}</td>
          <td>${(v.digg_count||0).toLocaleString()}</td>
          <td>${(v.comment_count||0).toLocaleString()}</td>
          <td>${(v.collect_count||0).toLocaleString()}</td>
          <td>${(v.share_count||0).toLocaleString()}</td>
          <td><a href="https://www.tiktok.com/@${authorName}/video/${v.video_id}" target="_blank">Xem</a></td>
          <td><span class="col-status">OK</span></td>
        `;
        tbody.appendChild(tr);
      });
      output.appendChild(table);
    }

    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
        if (!currentData.length) return;
        
        const username = document.getElementById('username').value;
        const headers = ['STT', 'Link Anh', 'Kenh', 'Caption', 'View', 'Like', 'Comment', 'Save', 'Share', 'Link Video', 'Trang thai'];
        
        const rows = currentData.map((v, index) => {
            const authorName = v.author ? v.author.unique_id : username;
            const caption = (v.title || '').replace(/(\r\n|\n|\r)/gm, ' ').replace(/"/g, '""');
            
            return [
                index + 1,
                v.origin_cover || v.cover || '',
                authorName,
                `"${caption}"`,
                v.play_count || 0,
                v.digg_count || 0,
                v.comment_count || 0,
                v.collect_count || 0,
                v.share_count || 0,
                `https://www.tiktok.com/@${authorName}/video/${v.video_id}`,
                'OK'
            ];
        });

        const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        
        const link = document.createElement("a");
        link.href = url;
        link.setAttribute("download", `TikTok_${username}_${new Date().getTime()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
  </script>
</body>
</html>
