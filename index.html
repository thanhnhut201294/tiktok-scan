<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TikTok Video Scanner V10 (Auto)</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* CSS GIAO DIỆN CARTOON (Giữ nguyên) */
    :root { --primary:#ff0050; --secondary:#00f2ea; --bg:#f4f5f7; --b:#000; --thick:3px; }
    body { font-family:'Be Vietnam Pro',sans-serif; background:var(--bg); padding:20px; display:flex; flex-direction:column; align-items:center; }
    main { width:100%; max-width:1000px; background:#fff; border:3px solid var(--b); box-shadow:6px 6px 0 var(--b); border-radius:20px; padding:30px; }
    h1 { font-family:'Fredoka',sans-serif; color:var(--primary); text-shadow:2px 2px 0 #000; margin-bottom:30px; text-align:center; font-size: 32px;}
    .box { display:grid; grid-template-columns:1.5fr 0.5fr auto auto; gap:15px; margin-bottom:30px; }
    input { padding:12px; border:2px solid var(--b); border-radius:10px; font-weight:600; font-family:inherit; }
    button { padding:0 25px; font-weight:700; background:var(--primary); color:#fff; border:2px solid var(--b); border-radius:10px; cursor:pointer; box-shadow:3px 3px 0 var(--b); transition:0.1s; text-transform: uppercase;}
    button:active { transform:translate(2px,2px); box-shadow:0 0 0 #000; }
    button:disabled { background:#ccc; color:#666; box-shadow:none; cursor:not-allowed; }
    #dl { background:var(--secondary); color:#000; }
    #log { margin-bottom:20px; padding:15px; border:2px solid var(--b); border-radius:10px; font-weight:600; text-align:center; display: none; }
    table { width:100%; border-collapse:collapse; margin-top:20px; font-size: 14px;}
    th,td { border:2px solid var(--b); padding:10px; text-align:left; }
    th { background:var(--secondary); white-space:nowrap; }
    img { width:50px; height:50px; object-fit:cover; border:2px solid var(--b); border-radius:8px; display:block; }
    @media(max-width:768px){ .box{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <nav style="width:100%;max-width:1000px;display:flex;justify-content:flex-end;margin-bottom:20px;">
    <a href="https://thanhnhut201294.github.io/tool/" style="text-decoration:none;background:#fff;color:#000;font-weight:700;padding:8px 20px;border:3px solid #000;border-radius:30px;box-shadow:4px 4px 0 #000;">↩ Quay lại</a>
  </nav>

  <main>
    <h1>TikTok Video Scanner V10</h1>
    <p style="text-align:center;font-size:13px;color:#666;margin-bottom:20px">
        ⚡ Sử dụng hệ thống đa nguồn (RSSHub/ProxiTok) để vượt qua chặn IP.
    </p>
    <div class="box">
      <input id="u" placeholder="Nhập ID (vd: letuankhang2002)" value="letuankhang2002" />
      <input id="n" type="number" value="10" min="1" max="50" placeholder="Số lượng" />
      <button id="fetchBtn">🚀 Quét Auto</button>
      <button id="dl" disabled>💾 Excel</button>
    </div>
    <div id="log"></div>
    <div id="out" style="overflow-x:auto;"></div>
  </main>

  <script>
    // 👇👇👇 DÁN LINK GOOGLE SCRIPT MỚI CỦA BẠN VÀO ĐÂY 👇👇👇
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwyJ-KPSVyXOeiqLLMGPiqD2KXfoYeVpAIjRwa5zBQSFfCEiCE1odK0tBStb6kuZS7G/exec";
    // 👆👆👆

    let data = [];
    const log = (m, c='#fff') => { const e=document.getElementById('log'); e.textContent=m; e.style.background=c; e.style.display='block'; }

    // Hàm gọi API thông qua Proxy để tránh lỗi CORS trên trình duyệt
    async function fetchViaProxy(url) {
        // Sử dụng corsproxy.io để gọi Google Script từ trình duyệt mà không bị chặn
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
        const res = await fetch(proxyUrl);
        return await res.json();
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const u = document.getElementById('u').value.trim();
      const n = document.getElementById('n').value;
      if(!u) return alert('Nhập ID!');
      
      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      document.getElementById('dl').disabled = true;
      document.getElementById('out').innerHTML = '';
      data = [];
      log('⏳ Đang kết nối tới các Server vệ tinh...', '#e3f2fd');

      try {
        // Gọi Google Script
        const finalUrl = `${GOOGLE_SCRIPT_URL}?unique_id=${u}&count=${n}`;
        const json = await fetchViaProxy(finalUrl);

        if (json.code !== 0 || !json.data || !json.data.videos.length) {
            throw new Error(json.msg || "Không tìm thấy dữ liệu từ các nguồn dự phòng.");
        }

        const videos = json.data.videos.slice(0, n);
        data = videos;
        render(videos);
        log(`✅ Thành công! Tìm thấy ${videos.length} video từ nguồn mở.`, '#e8f5e9');
        document.getElementById('dl').disabled = false;

      } catch(e) {
        log(`❌ Lỗi: ${e.message}`, '#ffebee');
      } finally {
        btn.disabled = false;
      }
    });

    function render(list) {
      let h = '<table><tr><th>#</th><th>Ảnh</th><th>Caption</th><th>Tim</th><th>Cmt</th><th>Share</th><th>Link</th></tr>';
      list.forEach((v,i) => {
        h += `<tr>
          <td>${i+1}</td>
          <td><img src="${v.cover}"></td>
          <td>${(v.title||'-').substring(0,60)}</td>
          <td>${v.digg_count ? v.digg_count.toLocaleString() : '-'}</td>
          <td>${v.comment_count ? v.comment_count.toLocaleString() : '-'}</td>
          <td>${v.share_count ? v.share_count.toLocaleString() : '-'}</td>
          <td><a href="https://www.tiktok.com/@${v.author.unique_id}/video/${v.video_id}" target="_blank">Xem</a></td>
        </tr>`;
      });
      document.getElementById('out').innerHTML = h + '</table>';
    }

    document.getElementById('dl').addEventListener('click', () => {
      if(!data.length) return;
      const u = document.getElementById('u').value;
      const csv = "\uFEFFSTT,LinkAnh,Caption,Like,Comment,Share,LinkVideo\n" + 
        data.map((v,i) => `${i+1},${v.cover},"${(v.title||'').replace(/"/g,'""')}",${v.digg_count},${v.comment_count},${v.share_count},https://www.tiktok.com/@${v.author.unique_id}/video/${v.video_id}`).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
      a.download = `TikTok_${u}.csv`;
      a.click();
    });
  </script>
</body>
</html>
