<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiktok Get Video From Channel - V6</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff0050;
      --secondary: #00f2ea;
      --warning: #ffcc00; /* Màu vàng cảnh báo */
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --border-color: #000000;
      --border-width: 3px;
      --shadow-offset: 6px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-color);
      color: #000;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-nav {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .home-btn {
      text-decoration: none;
      background: #fff;
      color: #000;
      font-weight: 700;
      padding: 10px 25px;
      border: var(--border-width) solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      border-radius: 50px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .home-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border-color);
      background: var(--secondary);
    }

    main {
      width: 100%;
      max-width: 1400px;
      background: var(--card-bg);
      border: var(--border-width) solid var(--border-color);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border-color);
      border-radius: 20px;
      padding: 40px;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif; 
      font-size: 42px;
      text-align: center;
      color: var(--primary);
      -webkit-text-stroke: 1.5px #000;
      text-shadow: 3px 3px 0px #000;
      margin-top: 0;
      margin-bottom: 40px;
      letter-spacing: 1px;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr auto auto;
      gap: 20px;
      margin-bottom: 30px;
      align-items: end;
      background: #fff;
      padding: 20px;
      border: 2px dashed #000;
      border-radius: 15px;
    }

    .input-group { display: flex; flex-direction: column; }
    label { font-weight: 700; margin-bottom: 10px; font-size: 15px; text-transform: uppercase; }
    .hint { font-size: 12px; color: #666; font-weight: 500; text-transform: none; }

    input, button, textarea { font-family: 'Be Vietnam Pro', sans-serif; }

    input {
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 3px 3px 0px var(--border-color);
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      background-color: #e0f7fa;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px var(--border-color);
      border-color: var(--primary);
    }

    button {
      padding: 0 30px;
      font-size: 16px;
      font-weight: 700;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      transition: all 0.15s ease;
      height: 52px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    #fetchBtn { background-color: var(--primary); color: #fff; }
    #fetchBtn:hover:not(:disabled) { transform: translate(-3px, -3px); box-shadow: 6px 6px 0px var(--border-color); filter: brightness(1.1); }
    
    #downloadCsvBtn { background-color: var(--secondary); color: #000; }
    #downloadCsvBtn:hover:not(:disabled) { transform: translate(-3px, -3px); box-shadow: 6px 6px 0px var(--border-color); filter: brightness(1.05); }

    button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--border-color); }
    button:disabled { background-color: #ddd; color: #888; border-color: #999; box-shadow: none; cursor: not-allowed; transform: none; }

    /* --- MANUAL MODE PANEL (NEW) --- */
    #manual-panel {
        display: none; /* Ẩn mặc định */
        background: #fff8e1;
        border: 3px solid #000;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: 6px 6px 0px #000;
        animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .manual-header {
        font-family: 'Fredoka', sans-serif;
        font-size: 20px;
        color: #d32f2f;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .step-box {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }

    .step {
        flex: 1;
        min-width: 300px;
    }

    .manual-link {
        display: block;
        background: #000;
        color: #fff;
        padding: 12px;
        text-align: center;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 700;
        margin-bottom: 10px;
        transition: 0.2s;
    }
    .manual-link:hover { background: #333; transform: scale(1.02); }

    textarea {
        width: 100%;
        height: 120px;
        padding: 10px;
        border: 2px solid #000;
        border-radius: 8px;
        font-family: monospace;
        font-size: 13px;
        resize: vertical;
        margin-bottom: 10px;
    }

    #parseManualBtn {
        width: 100%;
        background: var(--warning);
        color: #000;
        height: 45px;
    }

    /* --- STATS & TABLE --- */
    #stats-board {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: #fff;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      padding: 20px 10px;
      text-align: center;
      box-shadow: 5px 5px 0px var(--border-color);
      transition: transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stat-card:hover { transform: translateY(-5px); background-color: #fff9fa; }
    .stat-title { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 8px; text-transform: uppercase; }
    .stat-value { font-size: 24px; font-weight: 800; color: #000; margin-bottom: 8px; }
    .stat-avg { font-size: 13px; font-weight: 700; background: var(--secondary); color: #000; border: 2px solid var(--border-color); border-radius: 50px; padding: 4px 12px; box-shadow: 2px 2px 0px var(--border-color); }

    #status {
      margin-bottom: 25px;
      padding: 20px;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      background: #fff;
      font-weight: 600;
      box-shadow: 4px 4px 0px #ccc;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .log-loading { color: #007bff; }
    .log-success { color: #009944; background: #e8f5e9 !important; border-color: #009944 !important; box-shadow: 4px 4px 0 #005c29 !important;}
    .log-error { color: #d32f2f; background: #ffebee !important; border-color: #d32f2f !important; box-shadow: 4px 4px 0 #b71c1c !important;}

    .table-container {
      overflow-x: auto;
      border: 3px solid var(--border-color);
      border-radius: 15px;
      box-shadow: 6px 6px 0px var(--border-color);
      background: #fff;
    }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th, td { border: 2px solid var(--border-color); padding: 15px; text-align: left; vertical-align: middle; font-size: 15px; }
    th { background-color: var(--secondary); color: #000; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    tr:nth-child(even) { background-color: #f8f9fa; }
    tr:hover { background-color: #fffde7; }
    .col-thumb img { width: 60px; height: 60px; object-fit: cover; border: 2px solid var(--border-color); border-radius: 10px; box-shadow: 3px 3px 0px rgba(0,0,0,0.1); display: block; }
    .col-status { background: #c3e6cb; color: #155724; border: 2px solid #155724; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 12px; box-shadow: 2px 2px 0px #155724; display: inline-block; text-align: center; }
    a { color: var(--primary); text-decoration: none; font-weight: 700; border-bottom: 2px solid transparent; transition: 0.2s; }
    a:hover { border-bottom: 2px solid var(--primary); background: #ffe6eb; }

    @media (max-width: 1100px) { #stats-board { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      main { padding: 20px; }
      h1 { font-size: 28px; }
      .controls { grid-template-columns: 1fr; gap: 15px; }
      button { width: 100%; }
      #stats-board { grid-template-columns: 1fr 1fr; }
      .step-box { flex-direction: column; }
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="https://thanhnhut201294.github.io/tool/" class="home-btn"><span>↩</span> Quay lại trang chủ</a>
  </nav>

  <main>
    <h1>Tiktok Get Video From Channel</h1>
    
    <div class="controls">
      <div class="input-group">
        <label>Link Kênh / ID TikTok</label>
        <input id="username" placeholder="Ví dụ: letuankhang2002" value="https://www.tiktok.com/@letuankhang2002" />
      </div>
      <div class="input-group">
        <label>Số lượng <span class="hint">(Max 48)</span></label>
        <input id="limit" type="number" value="10" min="1" max="48" />
      </div>
      <button id="fetchBtn">🚀 Quét Tự Động</button>
      <button id="downloadCsvBtn" disabled>💾 Tải Excel</button>
    </div>

    <div id="manual-panel">
        <div class="manual-header">⚠️ Tự động thất bại (Do API chặn Proxy). Hãy dùng cách này 100% thành công:</div>
        <div class="step-box">
            <div class="step">
                <label>Bước 1: Lấy dữ liệu gốc</label>
                <p style="font-size: 13px; margin: 5px 0;">Bấm nút dưới để mở API bằng mạng của bạn, sau đó <b>Copy toàn bộ</b> chữ trong trang đó.</p>
                <a id="apiLinkBtn" href="#" target="_blank" class="manual-link">🔗 Bấm để mở dữ liệu gốc (New Tab)</a>
            </div>
            <div class="step">
                <label>Bước 2: Dán và Xử lý</label>
                <textarea id="manualJson" placeholder='Dán toàn bộ nội dung bạn vừa copy vào đây... Ví dụ: {"code":0, "msg":"success"...}'></textarea>
                <button id="parseManualBtn">⚡ Phân tích dữ liệu vừa dán</button>
            </div>
        </div>
    </div>

    <div id="stats-board"></div>
    <div id="status">👋 Sẵn sàng. Nhập ID và bấm Quét!</div>
    <div id="output" class="table-container"></div>
  </main>

  <script>
    // Proxy List cho chế độ Auto
    const PROXY_LIST = [
        { url: 'https://api.allorigins.win/get?url=', type: 'wrapped' },
        { url: 'https://api.codetabs.com/v1/proxy?quest=', type: 'direct' },
        { url: 'https://thingproxy.freeboard.io/fetch/', type: 'direct' },
        { url: 'https://corsproxy.io/?', type: 'direct' }
    ];

    let currentData = []; 

    function log(msg, type = 'default') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = `log-${type}`;
    }

    function extractUsername(input) {
        if (!input) return '';
        let clean = input.trim();
        const atIndex = clean.indexOf('@');
        if (atIndex !== -1) return clean.substring(atIndex + 1).split('?')[0].split('/')[0];
        if (clean.includes('tiktok.com/')) return clean.replace(/\/$/, '').split('/').pop();
        return clean;
    }

    // --- AUTO MODE ---
    async function smartFetch(targetUrl) {
        for (const proxy of PROXY_LIST) {
            try {
                const finalUrl = proxy.url + encodeURIComponent(targetUrl + `&_t=${Date.now()}`);
                console.log(`Trying: ${new URL(proxy.url).hostname}`);
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000); // 6s timeout

                const res = await fetch(finalUrl, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error('Network Error');
                
                let data;
                if (proxy.type === 'wrapped') {
                    const temp = await res.json();
                    data = (typeof temp.contents === 'string') ? JSON.parse(temp.contents) : temp.contents;
                } else {
                    data = await res.json();
                }

                if (data.code === -1) throw new Error("Blocked");
                return data; 
            } catch (e) { /* Continue */ }
        }
        throw new Error("Tất cả Proxy đều bị chặn.");
    }

    // --- MANUAL MODE HANDLER ---
    document.getElementById('parseManualBtn').addEventListener('click', () => {
        const raw = document.getElementById('manualJson').value.trim();
        if (!raw) return alert("Bạn chưa dán nội dung vào ô trống!");
        
        try {
            const data = JSON.parse(raw);
            if (!data.data || !data.data.videos) {
                return alert("Dữ liệu bạn dán không đúng định dạng hoặc không có video nào!");
            }
            
            // Xử lý dữ liệu thủ công
            const username = document.getElementById('username').value; // Lấy tạm username từ input
            const videos = data.data.videos;
            currentData = videos; // Lưu để xuất excel
            
            document.getElementById('manual-panel').style.display = 'none'; // Ẩn bảng thủ công
            log(`✅ Xử lý thủ công thành công: ${videos.length} video.`, 'success');
            
            renderStats(videos);
            renderTable(videos, username);
            document.getElementById('downloadCsvBtn').disabled = false;
            
        } catch (e) {
            alert("Lỗi phân tích: Dữ liệu bạn dán không phải là JSON hợp lệ. Hãy chắc chắn bạn đã Copy HẾT trang web.");
        }
    });

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const rawInput = document.getElementById('username').value;
      const limit = parseInt(document.getElementById('limit').value);
      const manualPanel = document.getElementById('manual-panel');
      const apiLinkBtn = document.getElementById('apiLinkBtn');
      
      if (!rawInput) return alert('Nhập Link/ID!');
      const username = extractUsername(rawInput);
      
      // Reset UI
      document.getElementById('fetchBtn').disabled = true;
      document.getElementById('downloadCsvBtn').disabled = true;
      document.getElementById('output').innerHTML = '';
      document.getElementById('stats-board').style.display = 'none';
      manualPanel.style.display = 'none'; // Ẩn manual trước
      currentData = []; 

      // Chuẩn bị link cho chế độ thủ công (phòng hờ)
      const directApiUrl = `https://www.tikwm.com/api/user/posts?unique_id=${username}&count=30`;
      apiLinkBtn.href = directApiUrl;

      log(`🔄 Đang thử quét tự động ID: ${username}...`, 'loading');

      try {
        // Thử Auto trước
        const targetUrl = directApiUrl; 
        const data = await smartFetch(targetUrl);
        
        if (!data?.data?.videos) throw new Error("Không có video");
        
        // Auto thành công
        const videos = data.data.videos.slice(0, limit);
        currentData = videos;
        log(`✅ Auto thành công! Tìm thấy ${videos.length} video.`, 'success');
        renderStats(videos);
        renderTable(videos, username);
        document.getElementById('downloadCsvBtn').disabled = false;

      } catch (e) {
        // Auto thất bại -> Hiện chế độ thủ công
        log(`❌ Auto thất bại (Do Proxy bị chặn). Đã mở chế độ thủ công bên dưới 👇`, 'error');
        manualPanel.style.display = 'block'; // HIỆN BẢNG THỦ CÔNG
      } finally {
        document.getElementById('fetchBtn').disabled = false;
      }
    });

    // --- RENDER FUNCTIONS (Giữ nguyên) ---
    function renderStats(videos) {
        const board = document.getElementById('stats-board');
        let total = { view:0, like:0, cmt:0, save:0, share:0 };
        videos.forEach(v => {
            total.view += (v.play_count||0); total.like += (v.digg_count||0);
            total.cmt += (v.comment_count||0); total.save += (v.collect_count||0); total.share += (v.share_count||0);
        });
        const fmt = n => n.toLocaleString('vi-VN');
        const avg = n => Math.round(n/videos.length).toLocaleString('vi-VN');
        const card = (t, v, a) => `<div class="stat-card"><div class="stat-title">${t}</div><div class="stat-value">${fmt(v)}</div><div class="stat-avg">TB: ${avg(a)}</div></div>`;
        board.innerHTML = card('Xem', total.view, total.view) + card('Tim', total.like, total.like) + card('Bình Luận', total.cmt, total.cmt) + card('Lưu', total.save, total.save) + card('Chia Sẻ', total.share, total.share);
        board.style.display = 'grid';
    }

    function renderTable(videos, inputUsername) {
      const output = document.getElementById('output');
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr><th>STT</th><th>Ảnh</th><th>Kênh</th><th>Caption</th><th>View</th><th>Like</th><th>Cmt</th><th>Save</th><th>Share</th><th>Link</th><th>Status</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      videos.forEach((v, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td class="col-thumb"><img src="${v.cover}"></td>
          <td>${v.author?.unique_id || inputUsername}</td>
          <td title="${(v.title||'').replace(/"/g,'&quot;')}">${(v.title||'-').substring(0,50)}...</td>
          <td>${(v.play_count||0).toLocaleString()}</td>
          <td>${(v.digg_count||0).toLocaleString()}</td>
          <td>${(v.comment_count||0).toLocaleString()}</td>
          <td>${(v.collect_count||0).toLocaleString()}</td>
          <td>${(v.share_count||0).toLocaleString()}</td>
          <td><a href="https://www.tiktok.com/@${v.author?.unique_id}/video/${v.video_id}" target="_blank">Xem</a></td>
          <td><span class="col-status">OK</span></td>`;
        tbody.appendChild(tr);
      });
      output.appendChild(table);
    }

    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
        if (!currentData.length) return;
        const fileUsername = currentData[0]?.author?.unique_id || 'data';
        const headers = ['STT', 'Link Anh', 'Kenh', 'Caption', 'View', 'Like', 'Comment', 'Save', 'Share', 'Link Video', 'Trang thai'];
        const rows = currentData.map((v, i) => [
            i + 1, v.cover, v.author?.unique_id||fileUsername, `"${(v.title||'').replace(/"/g,'""')}"`,
            v.play_count, v.digg_count, v.comment_count, v.collect_count, v.share_count,
            `https://www.tiktok.com/@${v.author?.unique_id}/video/${v.video_id}`, 'OK'
        ]);
        const csv = ["\uFEFF"+headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `TikTok_${fileUsername}_${Date.now()}.csv`;
        link.click();
    });
  </script>
</body>
</html>
