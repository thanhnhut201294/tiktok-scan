<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tiktok Get Video From Channel</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* --- GIỮ NGUYÊN GIAO DIỆN CARTOON --- */
    :root { --primary:#ff0050; --secondary:#00f2ea; --bg:#f0f4f8; --border:#000; --thick:3px; --shadow:6px; }
    * { box-sizing:border-box; }
    body { font-family:'Be Vietnam Pro',sans-serif; background:var(--bg); color:#000; padding:20px; margin:0; display:flex; flex-direction:column; align-items:center; }
    .top-nav { width:100%; max-width:1400px; display:flex; justify-content:flex-end; margin-bottom:20px; }
    .home-btn { text-decoration:none; background:#fff; color:#000; font-weight:700; padding:10px 25px; border:var(--thick) solid var(--border); box-shadow:4px 4px 0 var(--border); border-radius:50px; transition:0.2s; display:inline-flex; align-items:center; gap:8px; font-size:14px; }
    .home-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--border); background:var(--secondary); }
    main { width:100%; max-width:1400px; background:#fff; border:var(--thick) solid var(--border); box-shadow:var(--shadow) var(--shadow) 0 var(--border); border-radius:20px; padding:40px; margin-bottom:40px; }
    h1 { font-family:'Fredoka',sans-serif; font-size:42px; text-align:center; color:var(--primary); -webkit-text-stroke:1.5px #000; text-shadow:3px 3px 0 #000; margin:0 0 40px; }
    .controls { display:grid; grid-template-columns:2fr 1fr auto auto; gap:20px; margin-bottom:40px; align-items:end; background:#fff; padding:20px; border:2px dashed #000; border-radius:15px; }
    label { font-weight:700; margin-bottom:10px; font-size:15px; text-transform:uppercase; }
    input { width:100%; padding:14px 18px; font-family:'Be Vietnam Pro',sans-serif; font-size:16px; font-weight:600; border:2px solid var(--border); border-radius:12px; box-shadow:3px 3px 0 var(--border); outline:none; transition:0.2s; }
    input:focus { background:#e0f7fa; transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--border); border-color:var(--primary); }
    button { padding:0 30px; font-family:'Be Vietnam Pro',sans-serif; font-size:16px; font-weight:700; border:2px solid var(--border); border-radius:12px; cursor:pointer; box-shadow:3px 3px 0 var(--border); transition:0.1s; height:52px; text-transform:uppercase; white-space:nowrap; }
    #fetchBtn { background:var(--primary); color:#fff; } #fetchBtn:hover:not(:disabled) { transform:translate(-3px,-3px); box-shadow:6px 6px 0 var(--border); filter:brightness(1.1); }
    #downloadCsvBtn { background:var(--secondary); color:#000; } #downloadCsvBtn:hover:not(:disabled) { transform:translate(-3px,-3px); box-shadow:6px 6px 0 var(--border); filter:brightness(1.05); }
    button:active:not(:disabled) { transform:translate(2px,2px); box-shadow:0 0 0 var(--border); } button:disabled { background:#ddd; color:#888; border-color:#999; box-shadow:none; cursor:not-allowed; transform:none; }
    #stats-board { display:none; grid-template-columns:repeat(5,1fr); gap:20px; margin-bottom:40px; }
    .stat-card { background:#fff; border:3px solid var(--border); border-radius:15px; padding:20px 10px; text-align:center; box-shadow:5px 5px 0 var(--border); transition:0.2s; display:flex; flex-direction:column; align-items:center; }
    .stat-card:hover { transform:translateY(-5px); background:#fff9fa; }
    .stat-title { font-size:14px; font-weight:600; color:#555; text-transform:uppercase; margin-bottom:8px; }
    .stat-value { font-size:24px; font-weight:800; color:#000; margin-bottom:8px; }
    .stat-avg { font-size:13px; font-weight:700; background:var(--secondary); color:#000; border:2px solid var(--border); border-radius:50px; padding:4px 12px; }
    #status { margin-bottom:25px; padding:20px; border:3px solid var(--border); border-radius:15px; background:#fff; font-weight:600; box-shadow:4px 4px 0 #ccc; min-height:60px; display:flex; align-items:center; justify-content:center; font-size:16px; }
    .log-loading { color:#007bff; } .log-success { color:#009944; background:#e8f5e9!important; border-color:#009944!important; } .log-error { color:#ff0050; background:#ffebee!important; border-color:#ff0050!important; }
    .table-container { overflow-x:auto; border:3px solid var(--border); border-radius:15px; box-shadow:6px 6px 0 var(--border); background:#fff; }
    table { width:100%; border-collapse:collapse; min-width:1000px; } th, td { border:2px solid var(--border); padding:15px; text-align:left; font-size:15px; }
    th { background:var(--secondary); color:#000; font-weight:700; text-transform:uppercase; white-space:nowrap; } tr:nth-child(even) { background:#f8f9fa; } tr:hover { background:#fffde7; }
    .col-thumb img { width:60px; height:60px; object-fit:cover; border:2px solid var(--border); border-radius:10px; display:block; }
    .col-status { background:#c3e6cb; color:#155724; border:2px solid #155724; padding:6px 12px; border-radius:12px; font-weight:800; font-size:12px; display:inline-block; }
    a { color:var(--primary); text-decoration:none; font-weight:700; } a:hover { border-bottom:2px solid var(--primary); background:#ffe6eb; }
    @media(max-width:1100px){ #stats-board { grid-template-columns:repeat(3,1fr); } } @media(max-width:768px){ .controls { grid-template-columns:1fr; } #stats-board { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <nav class="top-nav">
    <a href="https://thanhnhut201294.github.io/tool/" class="home-btn"><span>↩</span> Quay lại trang chủ</a>
  </nav>

  <main>
    <h1>Tiktok Get Video From Channel</h1>
    <div class="controls">
      <div style="display:flex; flex-direction:column;">
        <label>Link Kênh / ID</label>
        <input id="username" placeholder="Ví dụ: letuankhang2002" value="https://www.tiktok.com/@letuankhang2002" />
      </div>
      <div style="display:flex; flex-direction:column;">
        <label>Số lượng</label>
        <input id="limit" type="number" value="10" min="1" max="48" />
      </div>
      <button id="fetchBtn">🚀 Quét Data</button>
      <button id="downloadCsvBtn" disabled>💾 Tải Excel</button>
    </div>

    <div id="stats-board"></div>
    <div id="status">👋 Sẵn sàng. Nhập Link và bấm Quét!</div>
    <div id="output" class="table-container"></div>
  </main>

  <script>
    // =========================================================================
    // 👇👇👇 DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO GIỮA 2 DẤU NGOẶC KÉP BÊN DƯỚI 👇👇👇
    const GOOGLE_SCRIPT_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLhyzxKXXlqA1qZqqZwxRtMqHnfDQnuVYa90wM9AUN6xYBk-sHJGPAR1nK4u_rLRco7_Dde0JXVrMdM4A9RbR8Mv5SeHja6wYOCbG006F8KQEu-hVHcHNaP9UqbrwwWPQE4LUiO24QFx0hP7Ta9RAB285oGfuio6wyvCitcMVFDOp2MHC5H19U3sk1X3jCYtH1usC26LP36fNMC3PUO1zY1Y13SqnmMerC-lNGgb2B3sO3x7BNRPxR6YBbWFDrfD9J1GNr5S3BdG18DoY2WLtDDsZpns6A&lib=MXJAPVpquXJjoSy6ywmQMLk0RuRiIMNmY"; 
    // Ví dụ: "https://script.google.com/macros/s/AKfycbx.../exec"
    // =========================================================================

    let currentData = [];

    function log(msg, type='default') {
      const el=document.getElementById('status'); el.textContent=msg; el.className=`log-${type}`;
    }

    function extractUsername(input) {
      if(!input) return ''; let clean=input.trim();
      if(clean.includes('@')) return clean.split('@')[1].split('?')[0].split('/')[0];
      if(clean.includes('tiktok.com/')) return clean.replace(/\/$/,'').split('/').pop();
      return clean;
    }

    async function fetchFromGoogle(unique_id, count, cursor) {
      // Gọi sang Server Google của bạn
      if(GOOGLE_SCRIPT_URL.includes("DAN_LINK")) {
          throw new Error("Bạn chưa dán Link Google Apps Script vào code HTML!");
      }
      const finalUrl = `${GOOGLE_SCRIPT_URL}?unique_id=${unique_id}&count=${count}&cursor=${cursor}`;
      const res = await fetch(finalUrl);
      if(!res.ok) throw new Error("Lỗi kết nối Server Google");
      return await res.json();
    }

    async function runScan() {
      const rawInput = document.getElementById('username').value;
      const limit = parseInt(document.getElementById('limit').value);
      const username = extractUsername(rawInput);
      
      if(!username) return alert("Vui lòng nhập ID/Link hợp lệ!");

      const fetchBtn = document.getElementById('fetchBtn');
      fetchBtn.disabled = true;
      document.getElementById('downloadCsvBtn').disabled = true;
      document.getElementById('output').innerHTML = '';
      document.getElementById('stats-board').style.display = 'none';
      currentData = [];

      log(`🔄 Đang kết nối Server Google để quét ID: ${username}...`, 'loading');

      const allVideos = [];
      const processedIds = new Set();
      let cursor = 0;
      let hasMore = true;

      try {
        while(hasMore) {
           log(`⏳ Đang tải... Đã lấy ${allVideos.length}/${limit} video`, 'loading');
           
           // Gọi API qua Google Script
           const data = await fetchFromGoogle(username, 30, cursor);

           if(!data || !data.data || !data.data.videos) {
               if(allVideos.length === 0) throw new Error("Không tìm thấy video (Kênh riêng tư hoặc lỗi ID)");
               break; 
           }

           for(const v of data.data.videos) {
               if(!v.video_id || processedIds.has(v.video_id)) continue;
               if(allVideos.length >= limit) { hasMore=false; break; }
               allVideos.push(v);
               processedIds.add(v.video_id);
           }
           
           cursor = data.data.cursor;
           if(!data.data.hasMore || allVideos.length >= limit) hasMore = false;
        }

        currentData = allVideos;
        log(`✅ Thành công! Đã quét được ${allVideos.length} video.`, 'success');
        renderStats(allVideos);
        renderTable(allVideos, username);
        document.getElementById('downloadCsvBtn').disabled = false;

      } catch(e) {
        log(`❌ Lỗi: ${e.message}`, 'error');
      } finally {
        fetchBtn.disabled = false;
      }
    }

    function renderStats(videos) {
      const b=document.getElementById('stats-board');
      let t={v:0, l:0, c:0, s:0, sh:0};
      videos.forEach(x=>{ t.v+=x.play_count; t.l+=x.digg_count; t.c+=x.comment_count; t.s+=x.collect_count; t.sh+=x.share_count; });
      const f=n=>n.toLocaleString('vi-VN'), avg=n=>Math.round(n/videos.length).toLocaleString('vi-VN');
      const card=(k,v,a)=>`<div class="stat-card"><div class="stat-title">${k}</div><div class="stat-value">${f(v)}</div><div class="stat-avg">TB: ${avg(a)}</div></div>`;
      b.innerHTML=card('Xem',t.v,t.v)+card('Tim',t.l,t.l)+card('Bình Luận',t.c,t.c)+card('Lưu',t.s,t.s)+card('Chia Sẻ',t.sh,t.sh);
      b.style.display='grid';
    }

    function renderTable(videos, user) {
      const t=document.createElement('table');
      t.innerHTML=`<thead><tr><th>STT</th><th>Ảnh</th><th>Kênh</th><th>Caption</th><th>View</th><th>Like</th><th>Cmt</th><th>Save</th><th>Share</th><th>Link</th><th>Status</th></tr></thead><tbody></tbody>`;
      const tb=t.querySelector('tbody');
      videos.forEach((v,i)=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${i+1}</td><td class="col-thumb"><img src="${v.cover}"></td><td>${v.author?.unique_id||user}</td><td title="${(v.title||'').replace(/"/g,'&quot;')}">${(v.title||'-').substring(0,40)}...</td><td>${v.play_count.toLocaleString()}</td><td>${v.digg_count.toLocaleString()}</td><td>${v.comment_count.toLocaleString()}</td><td>${v.collect_count.toLocaleString()}</td><td>${v.share_count.toLocaleString()}</td><td><a href="https://www.tiktok.com/@${v.author?.unique_id}/video/${v.video_id}" target="_blank">Xem</a></td><td><span class="col-status">OK</span></td>`;
        tb.appendChild(tr);
      });
      document.getElementById('output').appendChild(t);
    }

    document.getElementById('fetchBtn').addEventListener('click', runScan);
    
    document.getElementById('downloadCsvBtn').addEventListener('click', ()=>{
       if(!currentData.length) return;
       const u=currentData[0]?.author?.unique_id||'data';
       const csv=["\uFEFFSTT,Link Anh,Kenh,Caption,View,Like,Comment,Save,Share,Link Video,Status"];
       currentData.forEach((v,i)=>csv.push(`${i+1},${v.cover},${v.author?.unique_id||u},"${(v.title||'').replace(/"/g,'""')}",${v.play_count},${v.digg_count},${v.comment_count},${v.collect_count},${v.share_count},https://www.tiktok.com/@${v.author?.unique_id}/video/${v.video_id},OK`));
       const b=new Blob([csv.join('\n')],{type:'text/csv;charset=utf-8;'});
       const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`TikTok_${u}_${Date.now()}.csv`; a.click();
    });
  </script>
</body>
</html>
