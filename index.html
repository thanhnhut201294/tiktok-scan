<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Boomerang V23 (Fix Local)</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f2ea; --secondary: #ff0050; --bg: #111; --card: #222; --text: #fff; }
        body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
        
        .container { width: 100%; max-width: 900px; }
        
        /* HEADER */
        .header-box { background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; text-align: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,242,234,0.1); }
        h1 { color: var(--secondary); margin: 0 0 10px 0; }
        
        /* SETUP AREA */
        .setup-area { background: #1a1a1a; padding: 20px; border-radius: 10px; border: 2px dashed #444; margin: 20px 0; text-align: center; }
        .bookmark-btn {
            display: inline-block; background: #000; color: var(--primary);
            text-decoration: none; font-weight: 800; padding: 12px 25px;
            border-radius: 50px; border: 2px solid var(--primary);
            cursor: grab; margin-top: 15px; box-shadow: 0 5px 0 #00aaaa; transition: 0.2s;
        }
        .bookmark-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #00aaaa; }
        
        /* CONTROLS */
        .control-panel { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input { flex: 2; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #333; color: #fff; font-weight: bold; outline: none; }
        button { flex: 1; padding: 15px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; white-space: nowrap; }
        #openBtn { background: var(--primary); color: #000; }
        #pasteBtn { background: #333; color: #fff; border: 1px solid #555; display: none; } /* Nút ẩn, hiện khi lỗi */
        #dlBtn { background: var(--secondary); color: #fff; }
        button:disabled { background: #444; color: #777; cursor: not-allowed; }

        /* STATUS */
        #status { text-align: center; margin-bottom: 20px; font-weight: bold; min-height: 24px; color: #aaa; padding: 10px; border-radius: 5px; }
        .pulse { animation: pulse 1.5s infinite; color: var(--primary) !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* TABLE */
        .table-box { overflow-x: auto; background: var(--card); border-radius: 15px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: #333; color: var(--primary); padding: 15px; text-align: left; white-space: nowrap; }
        td { padding: 12px 15px; border-bottom: 1px solid #333; }
        img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #444; }
        a { color: var(--secondary); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h1>TikTok Boomerang V23 🪃</h1>
        <p>Phiên bản sửa lỗi Local File & Tăng cường khả năng quét</p>

        <div class="setup-area">
            <strong>⚙️ BƯỚC 1:</strong> Kéo nút này thả lên thanh dấu trang (Bookmarks Bar).<br>
            <em style="font-size: 12px; color: #777;">(Nếu đã có nút cũ, hãy xóa đi và kéo nút mới này lên)</em><br>
            
            <a class="bookmark-btn" href="javascript:(function(){
                /* --- BOOMERANG V23 SCRIPT --- */
                try {
                    /* KIỂM TRA MÔI TRƯỜNG */
                    if(!window.location.href.includes('tiktok.com')) {
                        alert('❌ Lỗi: Bạn phải bấm nút này KHI ĐANG Ở TRANG TIKTOK!');
                        return;
                    }

                    /* TÌM DỮ LIỆU (THUẬT TOÁN MỚI) */
                    var data = [];
                    
                    // Cách 1: Tìm trong __UNIVERSAL_DATA...
                    var s1 = document.getElementById('__UNIVERSAL_DATA_FOR_REHYDRATION__');
                    if(s1) {
                        try {
                            var j = JSON.parse(s1.textContent);
                            var scope = j.__DEFAULT_SCOPE__;
                            if(scope) {
                                // Quét tất cả các keys để tìm itemList
                                for(var key in scope) {
                                    if(scope[key].itemList) {
                                        data = scope[key].itemList;
                                        break;
                                    }
                                }
                            }
                        } catch(e){}
                    }
                    
                    // Cách 2: Tìm trong SIGI_STATE (Backup)
                    if(!data.length) {
                        var s2 = document.getElementById('SIGI_STATE');
                        if(s2) {
                            try {
                                var j2 = JSON.parse(s2.textContent);
                                if(j2.ItemModule) data = Object.values(j2.ItemModule);
                            } catch(e){}
                        }
                    }

                    if(!data.length) {
                        alert('⚠️ Không tìm thấy video! Hãy cuộn chuột xuống dưới để load video rồi bấm lại.');
                        return;
                    }

                    /* CHUẨN HÓA DỮ LIỆU */
                    var cleanData = data.map(v => ({
                        id: v.id,
                        desc: (v.desc||'').replace(/\n/g,' '),
                        cover: v.video.cover,
                        stats: v.stats,
                        author: v.author
                    }));
                    
                    var jsonStr = JSON.stringify(cleanData);

                    /* GỬI DỮ LIỆU ĐI */
                    if(window.opener) {
                        // Thử gửi về trang mẹ
                        window.opener.postMessage({ type: 'TIKTOK_DATA', data: cleanData }, '*');
                        alert('✅ Đã tìm thấy ' + data.length + ' video!\nđang gửi về Tool...');
                    } else {
                        // Nếu không có trang mẹ (do chạy Local hoặc mở tab tay)
                        // Tự động copy vào clipboard
                        var dummy = document.createElement('textarea');
                        document.body.appendChild(dummy);
                        dummy.value = jsonStr;
                        dummy.select();
                        document.execCommand('copy');
                        document.body.removeChild(dummy);
                        alert('✅ Đã tìm thấy ' + data.length + ' video!\n⚠️ Do bạn chạy Offline, Tool không tự nhận được.\n\n👉 DỮ LIỆU ĐÃ ĐƯỢC COPY! Hãy quay lại Tool và bấm nút "DÁN DỮ LIỆU".');
                    }

                } catch(e) { alert('Lỗi Script: ' + e.message); }
            })();" title="Kéo nút này lên thanh Bookmark">🚀 GỬI DATA VỀ TOOL (V23)</a>
        </div>
    </div>

    <div class="control-panel">
        <input id="u" type="text" placeholder="Nhập ID TikTok (Ví dụ: letuankhang2002)" value="letuankhang2002">
        <button id="openBtn">📂 1. MỞ KÊNH</button>
        <button id="pasteBtn" title="Dùng khi chạy Offline">📋 DÁN DỮ LIỆU</button>
        <button id="dlBtn" disabled>💾 2. TẢI EXCEL</button>
    </div>

    <div id="status">👋 Sẵn sàng. Nhập ID và bấm Mở Kênh.</div>

    <div class="table-box">
        <div id="out"></div>
    </div>
</div>

<script>
    let currentData = [];
    const statusEl = document.getElementById('status');
    const uInput = document.getElementById('u');
    const pasteBtn = document.getElementById('pasteBtn');

    // HIỆN NÚT DÁN NẾU CHẠY OFFLINE
    if (window.location.protocol === 'file:') {
        pasteBtn.style.display = 'block';
        statusEl.innerHTML = "⚠️ Bạn đang chạy file Offline. Hãy dùng nút 'DÁN DỮ LIỆU' nếu Tool không tự nhận.";
        statusEl.style.color = "#ff9800";
    }

    // 1. MỞ TRANG TIKTOK
    document.getElementById('openBtn').addEventListener('click', () => {
        const u = uInput.value.trim();
        if(!u) return alert("Nhập ID!");
        
        statusEl.innerHTML = "⏳ Đang đợi... (Sang tab TikTok -> Bấm Bookmarklet -> Xem thông báo)";
        statusEl.className = "pulse";
        
        window.open(`https://www.tiktok.com/@${u}`, '_blank');
    });

    // 2. NHẬN DỮ LIỆU TỰ ĐỘNG (ONLINE)
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'TIKTOK_DATA') {
            handleData(event.data.data);
        }
    });

    // 3. NHẬN DỮ LIỆU THỦ CÔNG (OFFLINE - NÚT DÁN)
    pasteBtn.addEventListener('click', async () => {
        try {
            const text = await navigator.clipboard.readText();
            if (!text.startsWith('[')) return alert("Clipboard không chứa dữ liệu JSON hợp lệ!");
            
            const data = JSON.parse(text);
            handleData(data);
            alert("Đã dán thành công!");
        } catch (e) {
            // Fallback cho trình duyệt cũ
            const raw = prompt("Dán dữ liệu JSON vào đây:");
            if(raw) {
                try { handleData(JSON.parse(raw)); } catch(err) { alert("Dữ liệu lỗi!"); }
            }
        }
    });

    function handleData(videos) {
        currentData = videos;
        renderTable(videos);
        statusEl.innerHTML = `✅ Đã nhận thành công ${videos.length} video!`;
        statusEl.className = "";
        statusEl.style.color = "#00f2ea";
        document.getElementById('dlBtn').disabled = false;
    }

    function renderTable(list) {
        let h = '<table><thead><tr><th>#</th><th>Thumb</th><th>Caption</th><th>View</th><th>Tim</th><th>Cmt</th><th>Share</th><th>Link</th></tr></thead><tbody>';
        list.forEach((v,i) => {
            const author = v.author.uniqueId || v.author;
            h += `<tr>
                <td>${i+1}</td>
                <td><img src="${v.cover}"></td>
                <td>${(v.desc||'-').substring(0,60)}</td>
                <td style="color:#00f2ea;font-weight:bold">${v.stats.playCount.toLocaleString()}</td>
                <td>${v.stats.diggCount.toLocaleString()}</td>
                <td>${v.stats.commentCount.toLocaleString()}</td>
                <td>${v.stats.shareCount.toLocaleString()}</td>
                <td><a href="https://www.tiktok.com/@${author}/video/${v.id}" target="_blank">Xem</a></td>
            </tr>`;
        });
        h += '</tbody></table>';
        document.getElementById('out').innerHTML = h;
    }

    // 4. TẢI EXCEL
    document.getElementById('dlBtn').addEventListener('click', () => {
        if(!currentData.length) return;
        const u = uInput.value;
        const csv = "\uFEFFSTT,LinkAnh,Caption,View,Tim,Comment,Share,LinkVideo\n" + 
            currentData.map((v,i) => {
                const author = v.author.uniqueId || v.author;
                return `${i+1},${v.cover},"${(v.desc||'').replace(/"/g,'""')}",${v.stats.playCount},${v.stats.diggCount},${v.stats.commentCount},${v.stats.shareCount},https://www.tiktok.com/@${author}/video/${v.id}`;
            }).join('\n');
            
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `TikTok_${u}_${Date.now()}.csv`;
        link.click();
    });
</script>

</body>
</html>
